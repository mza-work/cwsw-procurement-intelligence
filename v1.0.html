<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<title>Cherrywork Procurement Intelligence v1.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — top bar, persona-aware left rail, working canvas; Cherrywork blue as the single accent */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --surface-2:#EEF3F7; --ink:#1C252D; --muted:#5A6977; --line:#DCE3E9;
  --accent:#2563EB; --accent-ink:#1D4ED8; --accent-soft:#E2F1FB;
  --coral:#E0545A; --coral-soft:#FCE9EA; --purple:#7C3AED; --purple-soft:#ECE8F6;
  --green:#21875C; --green-soft:#E1F3EA; --amber:#B7791F; --amber-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(20,40,60,.06),0 4px 14px rgba(20,40,60,.05);
  --f-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif; --f-body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171C; --surface:#182129; --surface-2:#1F2A33; --ink:#E6EDF3; --muted:#98A8B6; --line:#2B3843;
  --accent:#3AA8EE; --accent-ink:#7CC4F4; --accent-soft:#16344A; --coral:#F07A7F; --coral-soft:#3A2224;
  --purple:#9C88E0; --purple-soft:#2A2440; --green:#4CC28D; --green-soft:#173326; --amber:#E0A54A; --amber-soft:#3A2D16;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#182129; --surface-2:#1F2A33; --ink:#E6EDF3; --muted:#98A8B6; --line:#2B3843;
  --accent:#3AA8EE; --accent-ink:#7CC4F4; --accent-soft:#16344A; --coral:#F07A7F; --coral-soft:#3A2224;
  --purple:#9C88E0; --purple-soft:#2A2440; --green:#4CC28D; --green-soft:#173326; --amber:#E0A54A; --amber-soft:#3A2D16;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:17px} h3{font-size:14px}
a{color:var(--accent-ink)}
.tn{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font:700 15px var(--f-display)}
.brand b{font-family:var(--f-display);font-size:15px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11px}
.top .grow{flex:1}
.persona-pick{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.persona-pick label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.persona-pick select{border:0;background:transparent;font-weight:600;padding:4px;max-width:260px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--coral);color:var(--coral)}
.btn:disabled{opacity:.5;cursor:default}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 57px)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px 40px;position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow:auto}
.rail h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 6px}
.rail a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:13px}
.rail a:hover{background:var(--surface-2)}
.rail a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.rail a .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:auto}
.rail .mine{background:var(--surface-2);border-radius:9px;padding:6px;margin-bottom:6px}
.main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-h{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.page-h p{margin:4px 0 0;color:var(--muted);max-width:80ch}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{cursor:pointer;text-decoration:none}
.meta{font-size:12px;color:var(--muted)}

/* scenario bar */
.scn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--purple-soft);border:1px solid var(--purple);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.scn b{color:var(--purple)}
.scn .grow{flex:1;min-width:200px}

/* cards & grids */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:12px}
.kpi{display:flex;flex-direction:column;gap:4px;position:relative}
.kpi .lbl{font-size:12px;color:var(--muted)}
.kpi .val{font:600 24px var(--f-display);font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.click{cursor:pointer}
.kpi.click:hover{border-color:var(--accent)}
.delta-up{color:var(--coral)} .delta-dn{color:var(--green)} .good{color:var(--green)} .bad{color:var(--coral)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.g{background:var(--green-soft);color:var(--green)} .pill.r{background:var(--coral-soft);color:var(--coral)} .pill.a{background:var(--amber-soft);color:var(--amber)} .pill.b{background:var(--accent-soft);color:var(--accent-ink)} .pill.p{background:var(--purple-soft);color:var(--purple)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:999px;margin-left:4px;vertical-align:middle}
.tag.ir{background:var(--coral);color:#fff}
.tag.ask{border:1px solid var(--accent);color:var(--accent-ink)}
.req{display:none}
body.trace .req{display:inline-flex;gap:3px;flex-wrap:wrap;margin-left:6px;vertical-align:middle}
.req span{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--amber-soft);color:var(--amber);border:1px dashed var(--amber)}
body.trace .req span.ir{background:var(--coral-soft);color:var(--coral);border-color:var(--coral)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);background:var(--surface-2);padding:8px 10px;white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--accent);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea,input.inp,select.inp{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--surface);color:var(--ink);font-size:13px}
.search-big{display:flex;gap:8px}
.search-big input{flex:1;min-width:0;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.note{font-size:12px;color:var(--muted)}
.callout{border-radius:8px;padding:10px 12px;background:var(--accent-soft);color:var(--ink);font-size:13px}
.callout.warn{background:var(--amber-soft)} .callout.bad{background:var(--coral-soft)} .callout.good{background:var(--green-soft)} .callout.ai{background:var(--purple-soft)}
.ai-mark{display:inline-flex;align-items:center;gap:4px;color:var(--purple);font-weight:600;font-size:12px}
.bar-in{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar-in i{display:block;height:100%;background:var(--accent);border-radius:999px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;background:var(--surface)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
svg text{fill:var(--muted);font-family:var(--f-body)}
.chart{width:100%;height:auto;display:block}
.empty{padding:24px;text-align:center;color:var(--muted)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps span{padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.steps span.on{background:var(--accent);color:#fff}
.steps span.done{background:var(--green-soft);color:var(--green)}

/* drawers, modal, toast */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.drawer footer{border-top:1px solid var(--line);padding:12px 16px}
.msg{border-radius:10px;padding:10px 12px;font-size:13px}
.msg.q{background:var(--accent-soft);align-self:flex-end;max-width:90%}
.msg.a{background:var(--surface-2)}
.msg .cite{margin-top:8px;font-size:12px;color:var(--muted)}
.msg .cite a{cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:39}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:86vh;overflow:auto;background:var(--surface);border-radius:12px;z-index:50;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.sample{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--amber-soft);color:var(--amber);font-weight:600;white-space:nowrap}
.persona-card{cursor:default}
.persona-card ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.persona-card li a{cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 13px var(--f-display);flex:none}
.email{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);font-size:13px}
.email .hd{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px;color:var(--muted);font-size:12px}
@media (max-width:1100px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.shell{grid-template-columns:1fr}.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px}.rail h4,.rail .mine-h{display:none}.rail .mine{display:contents}.rail a{white-space:nowrap}.rail a .dot{display:none}
 .g2,.g3,.g4,.g6{grid-template-columns:1fr}.span2{grid-column:auto}.top{gap:8px}.persona-pick select{max-width:170px}}
@media (prefers-reduced-motion:no-preference){.card,.btn,.chip{transition:border-color .15s,background .15s}}

/* simplified shell */
.top{gap:10px;padding-block:10px}
.brand b{font-size:15px}
.ctx{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-weight:600;font-size:13px;max-width:100%}
.ctx:hover{border-color:var(--accent)}
.ctx-k{background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
.av.sm{width:24px;height:24px;font-size:10px}
.tabbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:15;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar-in{display:flex;align-items:center;gap:2px;overflow-x:auto;max-width:1400px;margin:0 auto}
.tabbar a{padding:12px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tabbar a:hover{color:var(--ink)}
.tabbar a.on{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
.tabbar .grow{flex:1}
.main{max-width:1400px;margin:0 auto}
.main.wide{max-width:1180px}
.scn{background:var(--surface);border:1px solid var(--accent);border-left-width:1px}
.scn-k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);font-weight:700}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:52px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:45;display:flex;flex-direction:column;min-width:240px;padding:6px}
.menu button,.menu-t{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center}
.menu button:hover{background:var(--surface-2)}
.scrim.clear{background:transparent}
.top{position:sticky}
.start{display:flex;flex-direction:column;gap:12px}
.start-h h1{font-size:30px}
.start-h p{color:var(--muted);margin:6px 0 8px;max-width:70ch;font-size:15px}
.step-h{display:flex;align-items:center;gap:10px;font-size:15px;margin-top:10px}
.step-h span{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px}
.phase-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.phase{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;position:relative}
.phase:hover{border-color:var(--accent)}
.phase.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.ph-n{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink)}
.phase b{font-family:var(--f-display);font-size:16px}
.ph-wk{font-size:12px;color:var(--muted)}
.ph-d{font-size:12.5px;color:var(--ink);margin-top:4px}
.who-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.who{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer}
.who:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.who.off{opacity:.5;cursor:not-allowed}
.who-t{display:flex;flex-direction:column;min-width:0}
.who-t span{font-size:12px;color:var(--muted)}
.who-t .who-s{color:var(--accent-ink);font-weight:600;margin-top:2px}
.who.off .who-s{color:var(--muted)}
@media (max-width:1000px){.phase-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.phase-row{grid-template-columns:1fr}.ctx{font-size:12px}.brand b{display:none}.start-h h1{font-size:24px}.tabbar{position:static}.top{position:static}}
.fred-av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--accent);font:700 11px var(--f-display);margin-right:2px}
.fred-av.lg{width:36px;height:36px;font-size:16px;background:var(--accent);color:#fff}
.fred-n{display:block;font-size:11px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.flink{cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.msg p{margin:0 0 6px}.msg p:last-child{margin-bottom:0}
ul.fl{margin:4px 0 6px;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.fred-st{font-size:12px;color:var(--muted);margin-top:4px}
.fred-st:empty{display:none}
.msg.live .fred-st::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle;animation:fp 1s infinite}
@keyframes fp{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.msg.live .fred-st::before{animation:none}}
.sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}.sugg .meta{width:100%;margin-bottom:2px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}@media (max-width:1100px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fields{display:flex;flex-direction:column;margin-top:6px;font-size:13px}.fr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}.fr:last-child{border-bottom:0}.fr>.meta{flex:0 0 42%}.fv{text-align:right;min-width:0;overflow-wrap:anywhere}.fv details{text-align:left}

/* ---------- baselines (IR-01) ---------- */
function baselines(itemId, plant){
  const lines = PO.filter(p=>p.item===itemId && (!plant||p.plant===plant));
  if(!lines.length) return null;
  const last = lines[0];
  const recent = lines.filter(p=>p.mi>=12);
  const r = recent.length? recent: lines;
  const simple = r.reduce((a,p)=>a+p.price,0)/r.length;
  const qtyT = r.reduce((a,p)=>a+p.qty,0);
  const wavg = r.reduce((a,p)=>a+p.price*p.qty,0)/qtyT;
  const comp = r.filter(p=>p.buyType==='Planned'||p.buyType==='Blanket');
  const cq = comp.reduce((a,p)=>a+p.qty,0);
  const ctx = cq? comp.reduce((a,p)=>a+p.price*p.qty,0)/cq : wavg;
  const prem = r.filter(p=>p.buyType==='Ad hoc'||p.buyType==='Emergency').reduce((a,p)=>a+Math.max(0,(p.price-ctx))*p.qty+p.expedite,0);
  return {last, simple, wavg, ctx, prem, n:r.length, nComp: comp.length};
}

/* demand that could be clubbed: open requisitions + plants that reached their reorder point with nothing on order */
function demands(){const out=REQS.filter(r=>r.status==='Open').map(r=>({src:'Requisition',id:r.id,item:r.item,plant:r.plant,qty:r.qty,need:r.need,urgent:r.need.startsWith('Emergency')}));
  ITEMS.forEach(it=>{if(!QUOTES[it.id])return;PLANTS.forEach(pl=>{const s=it.stock[pl.id];if(!s.min||s.onOrder||s.available>s.rop*0.8||it.crit==='C')return;if(out.some(d=>d.item===it.id&&d.plant===pl.id))return;const q=Math.max(1,s.max-s.available);out.push({src:'Reorder point reached',id:'ROP-'+pl.id+'-'+it.pn.slice(2),item:it.id,plant:pl.id,qty:q,need:'Reorder point reached',urgent:false})})});return out}
function consolidations(){const g={};demands().filter(d=>!d.urgent).forEach(d=>{(g[d.item]=g[d.item]||[]).push(d)});const out=[];
  Object.entries(g).forEach(([id,ds])=>{if(ds.length<2||!QUOTES[id])return;const tot=sum(ds,d=>d.qty);const q=bestQuote(id,tot);if(!q)return;
    const sep=sum(ds,d=>{const b=bestQuote(id,d.qty);return b?qLanded(b,d.qty):qLanded(q,d.qty)});const comb=qLanded(q,tot);const save=sep-comb;if(save<40)return;

  const sp=sum(ls,p=>p.ext), psp=sum(pv,p=>p.ext);

  const st=S.rfpStep; const steps=['Item list','Suppliers & package','Responses & line matching','Total cost & award'];

   body=`<div class="callout ai" style="margin-bottom:12px"><span class="ai-mark">AI line matching</span>${REQ(['D11','T13'])} Each quoted line is matched to the requested line by part number, MPN and attributes; units are converted; unquoted lines are kept as gaps instead of breaking the comparison.</div>
   <div class="grid g3" style="margin-bottom:12px">${RFP.suppliers.map(s=>{const c=cnt(s);return `<div class="card"><b>${esc(supName(s))}</b><div class="stack" style="margin-top:8px;font-size:12px">${['Matched','UOM converted','Alternate offered','Spec deviation','Not quoted'].map(k=>`<div class="row sb"><span>${k}</span><b class="tn ${k==='Not quoted'||k==='Spec deviation'?'bad':''}">${c[k]||0}</b></div>`).join('')}</div></div>`}).join('')}</div>
   <div class="tw" style="max-height:400px;overflow:auto"><table><tr><th>Requested item</th>${RFP.suppliers.map(s=>`<th>${esc(supName(s))}</th>`).join('')}</tr>${RFP.lines.map((l,k)=>{const i=itemById(l.item);const prices=RFP.suppliers.map(s=>R[s][k].price).filter(Boolean);const mn=Math.min(...prices);return `<tr><td>${esc(i.desc)}<div class="meta mono">${i.mpn}</div></td>${RFP.suppliers.map(s=>{const r=R[s][k];return `<td>${r.price?`<b class="tn ${r.price===mn?'good':''}">${money2(r.price)}</b>`:'—'}<div><span class="pill ${r.status==='Matched'?'g':r.status==='Not quoted'||r.status==='Spec deviation'?'r':'a'}">${r.status}</span></div></td>`}).join('')}</tr>`}).join('')}</table></div>
   <div class="row" style="margin-top:12px"><button class="btn pri" data-act="rfpstep" data-id="4">Next: total cost & award</button></div>`}
  else if(st===4){const R=RFP.responses; const T=RFP.terms;
   const tot=s=>{let t=0,miss=0;RFP.lines.forEach((l,k)=>{const r=R[s][k];if(r.price&&r.status!=='Spec deviation')t+=r.price*l.vol;else miss++});return {unit:t,miss,total:t+T[s].freight}};
   const sc=RFP.suppliers.map(s=>({s,...tot(s)}));
   const cherry=(()=>{let t=0;RFP.lines.forEach((l,k)=>{const ps=RFP.suppliers.map(s=>R[s][k]).filter(r=>r.price&&r.status!=='Spec deviation').map(r=>r.price);if(ps.length)t+=Math.min(...ps)*l.vol});return t+sum(RFP.suppliers,s=>T[s].freight)})();
   const best=sc.filter(x=>x.miss<RFP.lines.length*0.08).sort((a,b)=>a.total-b.total)[0]||sc[0];
   const base=sum(RFP.lines,l=>{const b=baselines(l.item);return (b?b.ctx:itemById(l.item).base)*l.vol});
   const scen={total:{n:'Single supplier, lowest total cost',v:best.total,d:`Award all lines to ${supName(best.s)}; ${best.miss} lines need a second source.`},split:{n:'Split by group',v:(best.total+cherry)/2,d:'Ball and roller bearings to one supplier, chain and belts to another.'},cherry:{n:'Cherry-pick per line',v:cherry,d:'Lowest price per line; three suppliers to manage, freight paid three times.'}};
   body=`<div class="tw" style="margin-bottom:14px"><table><tr><th>Supplier</th><th class="n">Line total</th><th class="n">Freight</th><th>MOQ</th><th>Lead time</th><th>Payment terms</th><th class="n">Gaps</th><th class="n">Total cost</th></tr>${sc.map(x=>`<tr><td><b>${esc(supName(x.s))}</b></td><td class="n">${money(x.unit)}</td><td class="n">${money(T[x.s].freight)}</td><td>${T[x.s].moq}</td><td>${T[x.s].lead}</td><td>${T[x.s].terms}</td><td class="n ${x.miss?'bad':''}">${x.miss}</td><td class="n"><b>${money(x.total)}</b></td></tr>`).join('')}</table></div>
   <h2 style="margin-bottom:8px">Award scenarios ${IR('IR-09')}${REQ(['IR-09','IR-10'])}</h2>
   <div class="grid g3">${Object.entries(scen).map(([k,v])=>`<div class="card kpi click" data-act="award" data-id="${k}" style="${S.award===k?'border-color:var(--accent);background:var(--accent-soft)':''}"><span class="lbl">${v.n}</span><span class="val">${money(v.v)}</span><span class="sub">${v.d}</span><span class="sub good">Saving vs. comparable baseline ${money(base-v.v)} (${((1-v.v/base)*100).toFixed(1)}%)</span></div>`).join('')}</div>
   <div class="callout warn" style="margin-top:12px">Alternates and spec deviations on Incture-unique or critical parts go to maintenance engineering for approval before award (IR-10).</div>
   <div class="row" style="margin-top:12px"><button class="btn" data-act="rfpstep" data-id="3">Back</button><button class="btn pri" data-act="awardsubmit">${RFP.award?'Award submitted':'Submit award for approval'}</button></div>`}
  return pageHead(`RFP studio`,`${RFP.id} · ${esc(RFP.name)} · ${RFP.lines.length} lines (a production RFP may hold 10,000) · status <b>${RFP.status}</b>`,['D11','D12','T9','T13','IR-09'])+
  `<div class="steps">${steps.map((s,i)=>`<span class="${i+1===st?'on':i+1<st?'done':''}" data-act="rfpstep" data-id="${i+1}" style="cursor:pointer">${i+1}. ${s}</span>`).join('')}</div><div class="card">${body}</div>`};

   ${it.unique?`<div class="callout warn" style="margin-bottom:12px"><b>Incture-unique part.</b> Specification ${it.spec} is attached to the PO automatically, so the supplier ships the right part (T8, T9).</div>`:''}
   ${emerg?`<div class="callout bad" style="margin-bottom:12px"><b>Emergency buy.</b> Expected premium about ${money2(estPrem)} over the comparable-buy baseline (IR-11). It will be recorded as premium paid, not as the new baseline. ${it.crit==='A'?'Critical spare: add to the plant\'s review of min/max.':''}</div>`:''}
   <div class="grid g3" style="margin-bottom:12px"><div class="card kpi"><span class="lbl">Last paid ${ASK()}</span><span class="val">${money2(b.last.price)}</span><span class="sub">${fdate(b.last.date)} · ${esc(supName(b.last.sup))} · ${b.last.buyType}${b.last.expedite?' · $'+b.last.expedite+' expedite':''}</span></div>
   <div class="card kpi"><span class="lbl">Comparable baseline ${IR('IR-01')}</span><span class="val">${money2(b.ctx)}</span><span class="sub">planned and blanket buys, 12 months</span></div>
   <div class="card kpi"><span class="lbl">Contract</span><span class="val">${it.contract?money2(it.contract.price):'None'}</span><span class="sub">${it.contract?esc(supName(it.contract.sup))+' · ends '+fdate(it.contract.end):'add to next sourcing wave'}</span></div></div>
   <h3 style="margin-bottom:6px">Stock across plants</h3><div class="tw" style="margin-bottom:12px"><table><tr><th>Plant</th><th class="n">On hand</th><th class="n">Min</th><th class="n">Max</th></tr>${PLANTS.map(p=>`<tr class="${donors.some(d=>d.id===p.id)?'sel':''}"><td>${p.name}${p.id===r.plant?' (requesting)':''}</td><td class="n">${it.stock[p.id].onHand}</td><td class="n">${it.stock[p.id].min}</td><td class="n">${it.stock[p.id].max}</td></tr>`).join('')}</table></div>
   ${r.status==='Open'?`<div class="field"><label for="reqReason">Reason if you choose something other than the recommendation</label><input id="reqReason" placeholder="e.g. Contract supplier cannot deliver in time"></div>
   <div class="row" style="margin-top:10px">${donors.length?`<button class="btn pri" data-act="reqdo" data-id="${r.id}" data-d="Transfer from ${donors[0].name}">Create transfer from ${donors[0].name}</button>`:''}${it.contract?`<button class="btn ${donors.length?'':'pri'}" data-act="reqdo" data-id="${r.id}" data-d="PO on contract ${it.contract.id}">Order on contract</button>`:''}<button class="btn" data-act="reqdo" data-id="${r.id}" data-d="PO off contract">Order from another supplier</button><button class="btn sm ghost" data-act="part" data-id="${it.id}">Part 360</button></div>`:`<div class="callout good">Done: ${esc(r.result)}</div>`}</div>`}
  return pageHead('Requisition assist','Open requisitions with the price, contract and stock context a buyer needs before placing the order. In production this runs inside the Ariba requisition approval.',['T3','T4','T9','IR-01','IR-11'])+`<div class="grid ${r?'g2':''}">${list}${det}</div>`};

/* ---------- Supplier onboarding (WS0) ---------- */
V.onboarding = ()=>{

   <div class="row"><span class="note">${o.sel.size} selected</span><button class="btn sm" data-act="obsel">Select all shown (${Math.min(rows.length,200)})</button><button class="btn sm pri" data-act="remind" ${o.sel.size?'':'disabled'}>Send reminder</button><button class="btn sm" data-act="reassign" ${o.sel.size?'':'disabled'}>Reassign owner</button></div></div>
   <div class="tw" style="max-height:440px;overflow:auto"><table><tr><th></th><th>SLP ID</th><th>Supplier</th><th>Stage</th><th class="n">Days in stage</th><th>Open questionnaires</th><th>Owner</th><th class="n">Reminders</th><th>S/4HANA ID</th><th class="n">Spend 12m</th></tr>
   ${rows.slice(0,200).map(x=>`<tr class="click" data-act="slp" data-id="${x.id}"><td><input type="checkbox" aria-label="Select ${esc(x.name)}" data-act="obpick" data-id="${x.id}" ${o.sel.has(x.id)?'checked':''}></td><td class="mono">${x.id}</td><td>${esc(x.name)}</td><td><span class="pill ${x.stage==='int'?'g':x.stage==='approved'?'b':x.stage==='notinv'?'':'a'}">${STAGES.find(s=>s.id===x.stage).name}</span></td><td class="n ${x.days>60&&x.stage!=='int'?'bad':''}">${x.stage==='notinv'?'—':x.days}</td><td>${x.quest?x.quest+' modular':'—'}</td><td>${x.owner}</td><td class="n">${x.reminders}</td><td class="mono">${x.oracle||'—'}</td><td class="n">${money(x.spend12)}</td></tr>`).join('')}</table></div><p class="note" style="margin-top:6px">Showing ${Math.min(rows.length,200)} of ${num(rows.length)}.</p></div>`};

/* ---------- Data quality ---------- */
V.dataquality = ()=>{
  const t=S.dq; let body='';
  if(t==='cat'){const open=CATQ.filter(c=>c.status==='Open');body=`<div class="grid g3" style="margin-bottom:12px">${kpi('Keep (≥ 95% confident)',CATQ.filter(c=>c.tier==='keep').length,'assigned code looks right','good')}${kpi('Suggest (70–95%)',CATQ.filter(c=>c.tier==='suggest').length,'two alternatives offered','')}${kpi('Human review (< 70%)',CATQ.filter(c=>c.tier==='human').length,'description does not fit any code','bad')}</div>
   <div class="tw"><table><tr><th>Line</th><th>Description</th><th>Source</th><th>Assigned</th><th>AI suggestion</th><th class="n">Confidence</th><th>Action</th></tr>${CATQ.map(c=>`<tr><td class="mono">${c.id}<div class="meta">${c.line}</div></td><td>${esc(c.desc)}<div class="meta">${c.user}</div></td><td>${c.src}</td><td>${esc(c.assigned)}</td><td>${c.tier==='keep'?'<span class="pill g">Keep</span>':c.tier==='suggest'?c.suggest.map((s,i)=>`<div><label><input type="radio" name="r${c.id}" ${i===0?'checked':''}> ${esc(s)}</label></div>`).join(''):'<span class="pill r">Needs a person</span><div class="meta">'+esc(c.suggest[0])+'?</div>'}</td><td class="n"><b class="${c.conf>=95?'good':c.conf<70?'bad':''}">${c.conf}%</b></td><td>${c.status!=='Open'?`<span class="pill g">${c.status}</span>`:`<div class="row"><button class="btn sm pri" data-act="catq" data-id="${c.id}" data-d="${c.tier==='keep'?'Kept':'Re-categorised'}">${c.tier==='keep'?'Confirm':'Apply'}</button><button class="btn sm" data-act="catq" data-id="${c.id}" data-d="Sent to category team">Route</button></div>`}</td></tr>`).join('')}</table></div>
   <p class="note" style="margin-top:8px">Accepted corrections are written back to Ariba and retrain the model. Recurring gaps in Incture's 1,100 codes become proposals for new codes. "contract labor - electrician" has no MRO code: proposed new services code.</p>`}
  if(t==='dup') body=`<p class="note" style="margin-bottom:10px">Records that arrive from both Ariba and S/4HANA would double-count usage and spend (T6). Each pair is matched and merged before any metric is calculated.</p><div class="tw"><table><tr><th>ID</th><th>Item</th><th>Issue</th><th>Ariba record</th><th>S/4HANA record</th><th class="n">Double-counted value</th><th>Action</th></tr>${DUPS.map(d=>`<tr class="click" data-act="part" data-id="${d.item}"><td class="mono">${d.id}</td><td>${esc(itemById(d.item).desc)}</td><td>${d.field}</td><td class="mono">${d.ariba}</td><td class="mono">${d.oracle}</td><td class="n">${money(d.impact)}</td><td>${d.status==='Open'?`<button class="btn sm pri" data-act="dup" data-id="${d.id}">Merge</button>`:'<span class="pill g">Merged</span>'}</td></tr>`).join('')}</table></div>`;
  if(t==='uniq') body=`<p class="note" style="margin-bottom:10px">Incture estimates 40,000–50,000 of its 100,000 parts are unique: they cannot be bid on part number alone (T8). AI proposes the flag from description clues and failure history; buyers or maintenance confirm and attach the spec.</p><div class="tw"><table><tr><th>ID</th><th>Item</th><th>Evidence</th><th class="n">Confidence</th><th>Spec / drawing</th><th>Status</th></tr>${UNIQ.map(u=>{const i=itemById(u.item);return `<tr><td class="mono">${u.id}</td><td><a href="#part" data-act="part" data-id="${i.id}">${esc(i.desc)}</a><div class="meta mono">${i.pn}</div></td><td>${esc(u.evidence)}</td><td class="n">${u.conf}%</td><td>${i.spec||'<span class="meta">none</span>'}</td><td>${u.status==='Proposed'?`<div class="row"><button class="btn sm pri" data-act="uniq" data-id="${u.id}" data-d="Confirmed">Confirm</button><button class="btn sm" data-act="uniq" data-id="${u.id}" data-d="Not unique">Not unique</button></div>`:`<span class="pill ${u.status==='Confirmed'?'g':''}">${u.status}</span>`}</td></tr>`}).join('')}</table></div>`;
  if(t==='item'){const fill=ITEMS.filter(i=>i.mpnFilled).length/ITEMS.length;body=`<div class="grid g3" style="margin-bottom:12px">${kpi('MPN filled',(fill*100).toFixed(0)+'%','of items in this sample','bad','',['G4'])}${kpi('Unit conversions defined','71%','needed for price comparison','bad','',['D6'])}${kpi('Items with attributes extracted','64%','by AI from descriptions','')}</div>
   <div class="tw"><table><tr><th>Item</th><th>Missing</th><th>AI proposal</th><th>Action</th></tr>${ITEMS.filter(i=>!i.mpnFilled).slice(0,15).map(i=>`<tr><td>${esc(i.desc)}<div class="meta mono">${i.pn}</div></td><td>MPN, manufacturer</td><td class="mono">${i.mfr} · ${i.mpn}</td><td><button class="btn sm" data-act="mpn" data-id="${i.id}">${i.mpnFilled?'Applied':'Apply'}</button></td></tr>`).join('')}</table></div>`}
  return pageHead('Data quality','Clean data is the product: categories, duplicates, unique items and the item master, each with confidence and a human decision (IR-05).',['T6','T7','T8','G4','IR-05'])+
  `<div class="tabs">${[['cat','Re-categorisation ('+CATQ.filter(c=>c.status==='Open'&&c.tier!=='keep').length+')'],['dup','Ariba / S/4HANA duplicates ('+DUPS.filter(d=>d.status==='Open').length+')'],['uniq','Incture-unique items ('+UNIQ.filter(u=>u.status==='Proposed').length+')'],['item','Item master gaps']].map(([k,l])=>`<button class="${t===k?'on':''}" data-act="dqtab" data-id="${k}">${l}</button>`).join('')}</div><div class="card">${body}</div>`};

/* ---------- Supplier scorecards ---------- */
function scorecards(){return SUPPLIERS.map(s=>{const ls=L12.filter(p=>p.sup===s.id);if(!ls.length)return null;const otif=ls.filter(p=>p.received<=p.promised&&p.qtyRec>=p.qty).length/ls.length;const qty=ls.filter(p=>p.qtyRec>=p.qty).length/ls.length;
  const pc=ls.filter(p=>{const it=itemById(p.item);return !it.contract||p.price<=it.contract.price*1.01}).length/ls.length; const iv=INV.filter(v=>v.sup===s.id); const acc=1-iv.length/Math.max(1,ls.filter(p=>p.mi>=20).length);
  return {id:s.id,name:s.name,sp:sum(ls,p=>p.ext),lines:ls.length,otif,qty,pc,acc:Math.max(0,acc),prem:sum(ls.filter(p=>p.buyType==='Emergency'),p=>p.expedite)}}).filter(Boolean).sort((a,b)=>b.sp-a.sp)}
V.scorecards = ()=>{const sc=scorecards(); const sel=S.sc&&sc.find(x=>x.id===S.sc);
  const c=v=>v>=0.95?'good':v<0.85?'bad':'';
  let det=''; if(sel){const ls=L12.filter(p=>p.sup===sel.id);det=`<div class="card" style="margin-top:14px"><div class="card-h"><div><h2>${esc(sel.name)} by plant</h2><p>Same supplier, different plants: where does performance drop?</p></div><button class="btn sm ghost" data-act="sc" data-id="">Close</button></div><div class="tw"><table><tr><th>Plant</th><th class="n">Lines</th><th class="n">Spend</th><th class="n">On time in full</th><th class="n">Avg days late</th></tr>${PLANTS.map(p=>{const a=ls.filter(x=>x.plant===p.id);if(!a.length)return'';const ot=a.filter(x=>x.received<=x.promised&&x.qtyRec>=x.qty).length/a.length;const late=a.filter(x=>x.received>x.promised);return `<tr><td>${p.name}</td><td class="n">${a.length}</td><td class="n">${money(sum(a,x=>x.ext))}</td><td class="n ${c(ot)}">${(ot*100).toFixed(0)}%</td><td class="n">${late.length?(sum(late,x=>(x.received-x.promised)/864e5)/late.length).toFixed(1):'—'}</td></tr>`}).join('')}</table></div></div>`}
  return pageHead('Supplier scorecards','Contracted suppliers by delivery, quantity, price compliance and invoice accuracy, from PO, receipt and invoice data. Quality is added once a source is confirmed (D9).',['D9','T14','W-D'])+
  `<div class="card" style="padding:0"><div class="tw" style="border:0"><table><tr><th>Supplier</th><th class="n">Spend 12m</th><th class="n">Lines</th><th class="n">On time in full</th><th class="n">Qty compliance</th><th class="n">Price compliance</th><th class="n">Invoice accuracy</th><th class="n">Expedite paid</th></tr>
  ${sc.map(x=>`<tr class="click ${S.sc===x.id?'sel':''}" data-act="sc" data-id="${x.id}"><td><b>${esc(x.name)}</b></td><td class="n">${money(x.sp)}</td><td class="n">${x.lines}</td><td class="n ${c(x.otif)}">${(x.otif*100).toFixed(0)}%</td><td class="n ${c(x.qty)}">${(x.qty*100).toFixed(0)}%</td><td class="n ${c(x.pc)}">${(x.pc*100).toFixed(0)}%</td><td class="n ${c(x.acc)}">${(x.acc*100).toFixed(0)}%</td><td class="n">${money(x.prem)}</td></tr>`).join('')}</table></div></div>${det}`};
/* ---------- Plant storeroom ---------- */
function riskList(pl){return ITEMS.filter(i=>i.crit!=='C'&&i.stock[pl].min>0&&i.stock[pl].onHand<=i.stock[pl].min).map(i=>{const s=i.stock[pl];const use=Math.max(0.2,sum(L12.filter(p=>p.item===i.id&&p.plant===pl),p=>p.qty)/52);const cover=s.onHand/use;return {i,s,use,cover,short:cover*7<i.lead+14}}).sort((a,b)=>a.cover-b.cover)}
V.plant = ()=>{
  if(S.plantTab==='fail'&&!ph(3)) S.plantTab='risk'; const pl=S.plant, t=S.plantTab; let body='';
  if(t==='risk'){const r=riskList(pl);body=`<div class="callout warn" style="margin-bottom:12px">Summer peak starts in May: lines run longest and wear parts fail most. Each critical spare below needs cover for its lead time plus the peak.${REQ(['T4','G6','IR-06'])}</div>
   <div class="tw"><table><tr><th>Item</th><th>Crit.</th><th>Used on</th><th class="n">On hand</th><th class="n">Min</th><th class="n">Weeks of cover</th><th class="n">Lead time</th><th>Other plants</th><th>Action</th></tr>${r.map(x=>{const other=PLANTS.filter(p=>p.id!==pl&&x.i.stock[p.id].onHand>x.i.stock[p.id].min);return `<tr><td><a href="#part" data-act="part" data-id="${x.i.id}">${esc(x.i.desc)}</a>${x.i.unique?' <span class="pill p">unique</span>':''}</td><td><span class="pill ${x.i.crit==='A'?'r':'a'}">${x.i.crit}</span></td><td>${x.i.asset}</td><td class="n">${x.s.onHand}</td><td class="n">${x.s.min}</td><td class="n ${x.short?'bad':''}">${x.cover.toFixed(1)}</td><td class="n">${x.i.lead}d</td><td>${other.map(p=>p.id+' ('+x.i.stock[p.id].onHand+')').join(', ')||'—'}</td><td>${x.done?`<span class="pill g">${x.done}</span>`:`<div class="row">${other.length?`<button class="btn sm" data-act="plantdo" data-id="${x.i.id}" data-d="Transfer requested from ${other[0].id}">Transfer</button>`:''}<button class="btn sm pri" data-act="plantdo" data-id="${x.i.id}" data-d="Reorder raised">Reorder</button></div>`}</td></tr>`}).join('')}</table></div>`}
  if(t==='excess'){const all=ITEMS.filter(i=>i.stock[pl].max>0&&i.stock[pl].onHand>i.stock[pl].max||i.lastIssue>540&&i.stock[pl].onHand>0);const shown=S.critFilter?all.filter(i=>i.crit==='C'):all;
   body=`<div class="row sb" style="margin-bottom:12px"><label class="toggle"><input type="checkbox" id="critF" data-act="critf" ${S.critFilter?'checked':''}> Exclude critical spares (A and B) ${IR('IR-07')}</label><span class="note">${shown.length} of ${all.length} items · ${money(sum(shown,i=>(i.stock[pl].onHand-(i.stock[pl].max||0))*i.base))} above max</span></div>
   ${S.critFilter?'':`<div class="callout bad" style="margin-bottom:12px">Without the filter, ${all.filter(i=>i.crit!=='C').length} critical spares would be flagged as excess. Many sit idle by design; maintenance would reject the list.</div>`}
   <div class="tw"><table><tr><th>Item</th><th>Crit.</th><th class="n">On hand</th><th class="n">Max</th><th class="n">Days since last issue</th><th class="n">Excess value</th><th>Action</th></tr>${shown.map(i=>`<tr class="click" data-act="part" data-id="${i.id}"><td>${esc(i.desc)}</td><td><span class="pill ${i.crit==='A'?'r':i.crit==='B'?'a':''}">${i.crit}</span></td><td class="n">${i.stock[pl].onHand}</td><td class="n">${i.stock[pl].max}</td><td class="n ${i.lastIssue>540?'bad':''}">${i.lastIssue}</td><td class="n">${money(Math.max(0,i.stock[pl].onHand-i.stock[pl].max)*i.base)}</td><td>${i._done?`<span class="pill g">${i._done}</span>`:`<div class="row"><button class="btn sm" data-act="excess" data-id="${i.id}" data-d="Offered to other plants">Offer to plants</button><button class="btn sm" data-act="excess" data-id="${i.id}" data-d="Return to supplier">Return</button><button class="btn sm warn" data-act="excess" data-id="${i.id}" data-d="Write-off proposed">Write off</button></div>`}</td></tr>`).join('')}</table></div>`}
  if(t==='fail') body=`<p class="note" style="margin-bottom:10px">Failures recorded in the maintenance system are linked to the purchase that supplied the part. This is how a bearing without freezer-grade grease is traced to a distributor substitution (T10).</p><div class="tw"><table><tr><th>Item</th><th>Plant</th><th>Supplied by</th><th>Actual life</th><th>Expected</th><th>Finding</th><th>Action</th></tr>${FAIL.map((f,k)=>`<tr class="click" data-act="part" data-id="${f.item}"><td>${esc(itemById(f.item).desc)}</td><td>${f.plant}</td><td>${esc(supName(f.sup))}</td><td class="bad">${f.life}</td><td>${f.expected}</td><td>${esc(f.note)}</td><td>${f.done?`<span class="pill g">${f.done}</span>`:`<button class="btn sm pri" data-act="failflag" data-id="${k}">Flag unique + notify buyer</button>`}</td></tr>`).join('')}</table></div>`;
  const r=riskList(pl); const exc=ITEMS.filter(i=>i.crit==='C'&&i.stock[pl].max>0&&i.stock[pl].onHand>i.stock[pl].max);
  return pageHead('Plant storeroom',`Critical spares, excess and early failures for one plant. Inventory value $${INV_BY_PLANT[pl].now}M vs. target $${INV_BY_PLANT[pl].target}M.`,['T4','T10','W-E','W-F','IR-07'],`<select class="inp" id="plantSel" data-act="plantsel">${PLANTS.map(p=>`<option value="${p.id}" ${p.id===pl?'selected':''}>${p.name}, ${p.st}</option>`).join('')}</select>`)+
  `<div class="grid g4" style="margin-bottom:14px">${kpi('Inventory value','$'+INV_BY_PLANT[pl].now+'M',`target $${INV_BY_PLANT[pl].target}M`,'bad')}${kpi('Critical spares at risk',r.length,`${r.filter(x=>x.short).length} short before peak`,'bad')}${kpi('Excess (non-critical)',money(sum(exc,i=>(i.stock[pl].onHand-i.stock[pl].max)*i.base)),exc.length+' items')}${kpi('Early failures, 12m',FAIL.filter(f=>f.plant===pl).length,'linked to purchases')}</div>
  <div class="tabs">${[['risk','Critical spares at risk'],['excess','Excess & obsolete'],['fail','Early failures']].filter(x=>x[0]!=='fail'||ph(3)).map(([k,l])=>`<button class="${t===k?'on':''}" data-act="ptab" data-id="${k}">${l}</button>`).join('')}</div><div class="card">${body}</div>`};

/* ---------- Production & predictive (roadmap preview) ---------- */
V.production = ()=>{
  if(!ph(4)) S.prodTab='corr'; const t=S.prodTab||'corr'; let body='';
  if(t==='corr'){const pl=S.plant; const cons=MONTHS.map((_,i)=>sum(PO.filter(p=>p.plant===pl&&p.mi===i&&['BRG','LUB','PKG','PMP'].includes(p.cat)),p=>p.ext));
   const pts=MONTHS.map((m,i)=>({x:PROD[pl][i],y:cons[i],l:m.label,dd:{k:'po',f:{plant:pl,mi:i,cats:['BRG','LUB','PKG','PMP']},t:'Wear-part buys'}})); const n=pts.length,mx=sum(pts,p=>p.x)/n,my=sum(pts,p=>p.y)/n; const rr=sum(pts,p=>(p.x-mx)*(p.y-my))/Math.sqrt(sum(pts,p=>(p.x-mx)**2)*sum(pts,p=>(p.y-my)**2));
   body=`<div class="grid g2"><div><h3>Production volume and wear-part spend, ${plantName(pl)}</h3>${lineChart([{v:PROD[pl].map(v=>v),c:'var(--purple)',name:'Production'}],MONTHS.map(m=>m.label),{unit:v=>num(Math.round(v))+'k gal',tip:i=>'Wear-part spend '+money(cons[i]),drill:i=>({k:'po',f:{plant:pl,mi:i,cats:['BRG','LUB','PKG','PMP']},t:'Wear-part buys'})})}<p class="note">Production, thousand gallons per month (sample).</p></div>
   <div><h3>Correlation: r = ${rr.toFixed(2)}</h3>${scatter(pts,{xl:'Production, thousand gallons'})}<p class="note">Each dot is a month. Wear parts (bearings, H1 lubricants, packaging spares, pump parts) track run-hours.</p></div></div>
   <div class="callout ai" style="margin-top:12px"><span class="ai-mark">Insight</span> Every 100k gallons of extra output adds about ${money((sum(pts,p=>(p.x-mx)*(p.y-my))/sum(pts,p=>(p.x-mx)**2))*100)} of wear-part spend at ${plantName(pl)}. The 2027 plan peaks in July: buy ahead in March and April at planned prices instead of emergency buys in July.</div>`}
  if(t==='minmax'){const its=ITEMS.filter(i=>['BRG','LUB','PKG','PMP'].includes(i.cat)&&i.stock[S.plant].min>0).slice(0,18);body=`<p class="note" style="margin-bottom:10px">Min/max set from the production plan and planned shutdowns, not history alone (IR-13).</p><div class="tw"><table><tr><th>Item</th><th class="n">Current min / max</th><th class="n">Peak-season min / max</th><th>Shutdown kit</th><th>Action</th></tr>${its.map((i,k)=>{const s=i.stock[S.plant];const pm=Math.ceil(s.min*1.35),px=Math.ceil(s.max*1.25);return `<tr class="click" data-act="part" data-id="${i.id}"><td>${esc(i.desc)}</td><td class="n">${s.min} / ${s.max}</td><td class="n"><b>${pm} / ${px}</b></td><td>${k%3===0?'Feb 2027 shutdown, '+(ri(2,6))+' units':'—'}</td><td>${i._mm?`<span class="pill g">${i._mm}</span>`:`<button class="btn sm pri" data-act="mm" data-id="${i.id}">Apply for May–Aug</button>`}</td></tr>`}).join('')}</table></div>`}
  if(t==='pdm') body=`<p class="note" style="margin-bottom:10px">Condition and run-hour signals predict which part is needed and when, so critical spares are in place before failure and before the peak (IR-14).</p><div class="tw"><table><tr><th>Alert</th><th>Asset</th><th>Plant</th><th>Signal</th><th>Part likely needed</th><th>Window</th><th class="n">Confidence</th><th>Stock</th><th>Action</th></tr>${PDM.map(a=>{const i=itemById(a.item);return `<tr class="click" data-act="part" data-id="${i.id}"><td class="mono">${a.id}</td><td>${a.asset}</td><td>${a.plant}</td><td>${a.signal}</td><td>${esc(i.desc)}</td><td>${a.window}</td><td class="n">${a.conf}%</td><td>${i.stock[a.plant].onHand} on hand</td><td>${a.status==='Open'?`<button class="btn sm pri" data-act="pdm" data-id="${a.id}">Plan part + work order</button>`:`<span class="pill g">${a.status}</span>`}</td></tr>`}).join('')}</table></div>`;
  return pageHead('Production & maintenance',ph(4)?'Production volume and asset condition drive MRO demand: correlation, min/max from the production plan, predictive maintenance.':'Production volume linked to MRO use. Min/max from the production plan and predictive maintenance arrive in Project 2, Release 4.',['IR-12','IR-13','IR-14'],`<span class="tag ir">IR-12</span><span class="tag ir">IR-13</span><span class="tag ir">IR-14</span><select class="inp" id="plantSel2" data-act="plantsel">${PLANTS.map(p=>`<option value="${p.id}" ${p.id===S.plant?'selected':''}>${p.name}</option>`).join('')}</select>`)+
  `<div class="tabs">${[['corr','Production vs. MRO use'],['minmax','Min/max from production plan'],['pdm','Predictive maintenance']].filter(x=>x[0]==='corr'||ph(4)).map(([k,l])=>`<button class="${t===k?'on':''}" data-act="prodtab" data-id="${k}">${l}</button>`).join('')}</div><div class="card">${body}</div>`};

V.invoices = ()=>{
  const types=['All','Price above contract','Quantity billed > received','Unexpected surcharge','Possible duplicate'];
  const rows=INV.filter(v=>S.inv.type==='All'||v.type===S.inv.type); const sel=S.inv.sel&&INV.find(v=>v.id===S.inv.sel);
  const open=INV.filter(v=>v.status==='Open'); const rec=sum(INV.filter(v=>v.status==='Credit claimed'||v.status==='Disputed'),v=>v.leak);
  let det='';
  if(sel){const p=sel.poLine, it=itemById(sel.item);det=`<div class="card"><div class="card-h"><div><span class="meta mono">${sel.id} · ${esc(supName(sel.sup))}</span><h2>${sel.type}</h2><p>${esc(it.desc)} · ${plantName(sel.plant)}</p></div><button class="btn sm ghost" data-act="invsel" data-id="">Close</button></div>
   ${sel.highlight?'<div class="callout bad" style="margin-bottom:12px">The case from the discovery call: "we said we were going to pay $10 and they\'re charging us $100."</div>':''}
   <div class="grid g4" style="margin-bottom:12px"><div class="card"><div class="meta">Contract ${it.contract?it.contract.id:''}</div><b class="tn">${it.contract?money2(it.contract.price):'—'}</b></div><div class="card"><div class="meta">PO ${p.id}</div><b class="tn">${money2(sel.type==='Price above contract'&&it.contract?it.contract.price:p.price)} × ${p.qty}</b></div><div class="card"><div class="meta">Receipt</div><b class="tn">${p.qtyRec} received ${fdate(p.received)}</b></div><div class="card"><div class="meta">Invoice</div><b class="tn bad">${money2(sel.billed)} × ${sel.bq}${sel.sur?' + '+money2(sel.sur):''}</b></div></div>
   <div class="row sb" style="margin-bottom:12px"><span>Expected <b>${money2(sel.expected)}</b> · billed <b>${money2(sel.amount)}</b></span><b class="bad">Leakage ${money2(sel.leak)}</b></div>
   ${sel.dupOf?`<div class="callout warn" style="margin-bottom:12px">Same amount and PO as ${sel.dupOf}, billed under supplier ID ${sel.dupSupId}. Two IDs for one supplier (G2).</div>`:''}
   ${sel.status==='Open'?`<div class="field"><label for="invReason">Note to supplier / reason</label><input id="invReason" placeholder="e.g. Billed above contract ${it.contract?it.contract.id:''}; please issue credit"></div>
   <div class="row" style="margin-top:10px"><button class="btn pri" data-act="invdo" data-id="${sel.id}" data-d="Credit claimed">Claim credit</button><button class="btn" data-act="invdo" data-id="${sel.id}" data-d="On hold">Hold payment</button><button class="btn" data-act="invdo" data-id="${sel.id}" data-d="Disputed">Dispute</button><button class="btn ghost" data-act="invdo" data-id="${sel.id}" data-d="Approved">Approve anyway</button></div>`:`<div class="callout good">${sel.status}${sel.reason?': '+esc(sel.reason):''}</div>`}</div>`}
  return pageHead('Invoice exceptions','Checks beyond the three-way match: billed vs. contract price, quantity vs. receipt, surcharges and duplicates across supplier IDs. Each exception comes with its evidence.',['D10','T14','G2'])+
  `<div class="grid g4" style="margin-bottom:14px">${kpi('Open exceptions',open.length,'')}${kpi('Open leakage',money(sum(open,v=>v.leak)),'billed above expected','bad')}${kpi('Recovered / disputed',money(rec),'this session','good')}${kpi('First-pass match',(100-INV.length/PO.filter(p=>p.mi>=20).length*100).toFixed(1)+'%','invoices without exception')}</div>
  <div class="row" style="margin-bottom:12px">${types.map(x=>`<span class="chip ${S.inv.type===x?'on':''}" data-act="invtype" data-id="${x}">${x}${x==='All'?'':' ('+INV.filter(v=>v.type===x).length+')'}</span>`).join('')}</div>
  <div class="grid ${sel?'g2':''}"><div class="card" style="padding:0"><div class="tw" style="border:0;max-height:560px;overflow:auto"><table><tr><th>Invoice</th><th>Supplier</th><th>Type</th><th class="n">Billed</th><th class="n">Leakage</th><th>Status</th></tr>${rows.slice(0,120).map(v=>`<tr class="click ${S.inv.sel===v.id?'sel':''}" data-act="invsel" data-id="${v.id}"><td class="mono">${v.id}<div class="meta">${fdate(v.date)}</div></td><td>${esc(supName(v.sup))}</td><td>${v.type}</td><td class="n">${money2(v.amount)}</td><td class="n bad">${money2(v.leak)}</td><td><span class="pill ${v.status==='Open'?'a':v.status==='Approved'?'':'g'}">${v.status}</span></td></tr>`).join('')}</table></div></div>${det}</div>`};

function fredBrief(){const p=persona();const ph_=PHASES[S.phase];
 return `You are Copilot, the friendly procurement assistant inside the "Procurement Intelligence" prototype that Cherrywork Smart Warehouse built for Incture (a simulated ice cream manufacturer headquartered in Lakemont, Iowa; all data is simulated). Plants: LMN Lakemont North IA, LMS Lakemont South IA, DNK Dunmore NY, HND Hanford NV.

ANSWER QUESTIONS USING ONLY THE DEMO DATA, reached through your tools. All data is sample data for a demo; never invent figures. Call tools to get numbers; call several if needed. If the data cannot answer (for example real Incture figures, other spend areas, or systems not connected such as the CMMS or production plan beyond the sample), say so plainly and say what data would answer it.

Style: warm and plain-spoken, like a colleague who has been at Incture a long time. Lead with the answer in one or two sentences, then at most 5 short bullets with the key numbers. Money as $12.3K or $1.4M. No tables, no headings. Keep it under 150 words unless asked for detail.
When you mention a specific record, add a link marker so the user can open it: [[item:ITEM_ID|short label]], [[invoice:INV-ID|label]], [[supplier:SUPPLIER_ID|label]], [[opp:OP-ID|label]], [[plant:PLANT_ID|label]], or a screen [[screen:VIEW|label]] where VIEW is one of cockpit, explorer, opportunities, search, category, buyer, rfp, scorecards, onboarding, dataquality, plant, production, invoices, savings, datahealth.
Finish with one line starting "How I worked it out:" naming the measure you used in plain words.

Definitions: spend = PO line value; last 12 months = Nov 2025 to Oct 2026, prior 12 = Nov 2024 to Oct 2025. Last price paid = most recent PO line (Incture's current rule). Comparable-buy baseline (Cherrywork recommendation IR-01) = volume-weighted price of planned and blanket buys in the last 12 months, excluding expedite freight. Premium paid (IR-11) = price above that baseline on ad hoc and emergency buys, plus expedite freight. OTIF = received on or before the promised date and in full. Leakage = billed minus contract price x received quantity. Incture does not accept savings based on external peer benchmarks; Finance validates savings. Spare-parts inventory is $47.2M (target $42.6M by Jun 2027); it rose $6.0M, of which $3.5M was items newly added to the system, $1.4M price, $1.6M volume, -$0.5M consumption and write-offs. The sample covers about 360 items; Incture really has about 100,000 MRO items, 40,000-50,000 of them Incture-unique, and 2,344 suppliers in Ariba SLP.

Context: the person asking is the ${p.name}${p.id==='p2'?' (Daniel Avery)':p.id==='p3'?' (Willa Turner)':''}. The delivery being presented is ${PL(ph_.n)}, ${ph_.name}: ${ph_.desc} If the question is about something delivered in a later release, still answer from the data, and mention which release brings it. Today is ${fdate(TODAY)}.`}

doAsk=async function(q){
  const live=FRED&&FRED_OFF!=='denied'&&FRED_OFF!=='tools';
  if(!live){S.msgs.push({q});const r=answer(q);S.msgs.push({txt:r.txt,cites:r.cites,def:r.def});render();scrollFred();return}
  S.msgs.push({q}); const i=S.msgs.push({md:'',pending:true})-1; S.turns.push({role:'user',content:q}); render(); scrollFred();
  fredCtl=new AbortController();
  const recent=S.turns.slice(-12);
  const input=[{role:'user',content:fredBrief()},...recent];
  try{
    const res=await FRED(input,{tools:FRED_TOOLS.slice(0,FRED_TOOLS_MAX),modelTier:S.deep?'default':'quick',signal:fredCtl.signal,onText:({text})=>{S.msgs[i].md=text;paintLive(i)}});
    S.msgs[i].md=res.text; S.msgs[i].pending=false; if(res.truncated)S.msgs[i].err='Cut short. Ask for less at a time.'; S.turns.push({role:'assistant',content:res.text});
  }catch(e){const m=S.msgs[i];m.pending=false;m.md=e&&e.text||'';
    const c=e&&e.code;
    if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){FRED_OFF='denied';S.msgs.splice(i,1);const r=answer(q);S.msgs.push({txt:r.txt,cites:r.cites,def:r.def,note:'Live answers are off, so this is a prepared answer.'})}
    else if(c==='tools_unavailable'){FRED_OFF='tools';S.msgs.splice(i,1);const r=answer(q);S.msgs.push({txt:r.txt,cites:r.cites,def:r.def,note:'Live data lookups are not available in this view, so this is a prepared answer.'})}
    else if(c==='cancelled'){m.err='Stopped.'}
    else if(c==='rate_limited'){m.err='Copilot is getting a lot of questions right now. Try again in a minute.'}
    else if(c==='refused'){m.md='';m.err='Copilot can\'t help with that one. Try asking about spend, parts, suppliers, inventory or invoices.'}
    else if(c==='session_expired'){m.err='Please sign in again to keep asking Copilot.'}
    else {m.err='Something went wrong reaching Copilot. Ask again.'}
    if(m.md) S.turns.push({role:'assistant',content:m.md});}
  fredCtl=null; render(); scrollFred();
};

    if(k==='item'&&itemById(id)){S.part=id;go('part')}else if(k==='invoice'){S.inv.sel=id;S.inv.type='All';go('invoices')}else if(k==='supplier'){S.sc=id;go('scorecards')}else if(k==='opp'){S.opp=id;go('opportunities')}else if(k==='plant'){S.plant=mPlant(id)&&mPlant(id)!=='__none'?mPlant(id):S.plant;S.plantTab='risk';go('plant')}else if(k==='screen'&&V[id]){go(id)}else render()}

const T_=Object.fromEntries(FRED_TOOLS.map(t=>[t.name,t.execute]));
const _st=fredStatus; // tools call fredStatus; harmless when no live bubble
const ul=items=>`<ul class="fl">${items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const L=(label,fn)=>({l:label,...fn});
const goPart=id=>({go:'part',a:()=>S.part=id});
const lk=(label,go,a)=>({l:label,go,a});

/* ---------- entity extraction ---------- */
function entities(q){const s=lc(q);const e={};
  const p=PLANTS.find(p=>s.includes(lc(p.name))||new RegExp('\\b'+lc(p.id)+'\\b').test(s)||(p.id==='DNK'&&s.includes('new york'))||(p.id==='HND'&&s.includes('nevada')));if(p)e.plant=p.id;
  if(!e.plant&&/\ble mars\b/.test(s))e.plantGroup='Lakemont';
  const catWords={BRG:['bearing','chain','sprocket','belt','coupling','power transmission'],MOT:['motor','drive','vfd','gearmotor'],PMP:['pump','valve','seal'],REF:['refrigeration','ammonia','compressor','evaporator'],ELC:['electrical','sensor','plc','cable','control'],LUB:['lubricant','grease','oil','h1'],SAN:['sanitation','chemical','cip','sanitizer'],PKG:['packaging','filler','cartoner','wrapper'],FST:['fastener','bolt','nut','hardware'],SAF:['safety','ppe','glove','lockout'],FLT:['filter','hepa'],PNE:['pneumatic','cylinder']};
  for(const [k,ws] of Object.entries(catWords)) if(ws.some(w=>s.includes(w))){e.cat=k;e.catWord=ws.find(w=>s.includes(w));break}
  const generic=new Set(['supply','industrial','systems','services','motion','direct','bearing','drive','power','transmission','electric','refrigeration','fluid','fastener','safety','filter','group','pneumatics','chemical','machinery','parts','lubricants','lubrication','pumps','sanitary','process','controls','mechanical','motor','rewind','state','valley','great','lakes','northern','plains','foodgrade','cold','chain','(oem)','inc.']);const sp=SUPPLIERS.find(x=>s.includes(lc(x.name).split(' (')[0])||lc(x.name).split(' ').filter(w=>w.length>4&&!generic.has(w)).some(w=>new RegExp('\\b'+w.replace(/[^a-z]/g,'')+'\\b').test(s)));if(sp)e.sup=sp.id;
  if(!e.sup){const m=q.match(/\b(?:with|from|supplier|vendor)\s+([A-Z][A-Za-z&]+)/);if(m&&!PLANTS.some(p=>p.name.includes(m[1]))&&!['MRO','S/4HANA','Ariba','Incture'].includes(m[1]))e.unknownSup=m[1]}
  const pn=s.match(/\b(6\d{3}|22\d{3}|32\d{3}|nu\d{3}|uc\d{3}|w-\d{6})\b/);if(pn)e.text=pn[1];
  else{const hp=s.match(/(\d+(?:\.\d+)?)\s*hp/);if(hp&&e.cat==='MOT')e.text=hp[1]+' hp'}
  if(/emergenc/.test(s))e.buy='Emergency';else if(/ad hoc|adhoc|ad-hoc/.test(s))e.buy='Ad hoc';else if(/blanket/.test(s))e.buy='Blanket';else if(/\bplanned\b/.test(s))e.buy='Planned';
  const by=s.match(/\bby (plant|site|supplier|vendor|category|month|item|part|buy type|type)\b/);if(by)e.by={site:'plant',vendor:'supplier',part:'item','buy type':'buy_type',type:'buy_type'}[by[1]]||by[1];
  if(/last month/.test(s))e.month=MONTHS[23].key; else{const mn=['january','february','march','april','may','june','july','august','september','october','november','december'].findIndex(m=>s.includes(m));if(mn>=0){const mo=MONTHS.slice().reverse().find(m=>m.m===mn);if(mo)e.month=mo.key}}
  if(/24 months|two years|2 years/.test(s))e.period='all24';else if(/prior year|last year's|previous year/.test(s)&&!/vs|compare/.test(s))e.period='prior12';
  return e}
function scopeLabel(e){return [e.plant?plantName(e.plant):'',e.cat?catName(e.cat).toLowerCase():'',e.sup?supName(e.sup):'',e.text?e.text:'',e.buy?e.buy.toLowerCase()+' buys':'',e.month?MONTHS.find(m=>m.key===e.month).label:''].filter(Boolean).join(', ')}
function f_(e){return {plant:e.plant,category:e.cat,supplier:e.sup?supName(e.sup):undefined,item_text:e.text,buy_type:e.buy,month:e.month,period:e.period}}

function pickIt(e,q,n=1){const t=e.text||e.catWord||q;const r=T_.item_lookup({text:t,limit:8});const ex=r.details.filter(d=>lc(d.desc).includes(lc(t))||lc(d.pn).includes(lc(t)));const d=(ex.length?ex:r.details).slice(0,n);return {matches:r.matches,details:d}}
/* ---------- intent handlers (each returns {txt, def, cites}) ---------- */
const DEF={spend:'PO line value; last 12 months = Nov 2025–Oct 2026, compared with the 12 months before.',prem:'Premium paid = price above the comparable-buy baseline on ad hoc and emergency buys, plus expedite freight (IR-11).',base:'Comparable-buy baseline = weighted price of planned and blanket buys in the last 12 months (IR-01); last price paid is Incture\'s current rule.',otif:'On time in full = received on or before the promised date and in full quantity, last 12 months.',leak:'Leakage = billed amount minus contract price × received quantity.',inv:'On-hand quantity × standard cost from S/4HANA Inventory, month end.'};
const I={
 spend(e){const g=e.by||'none';const r=T_.spend_summary({...f_(e),group_by:g==='none'?'none':g,top:10});const sc=scopeLabel(e);
  if(r.no_match_for)return {txt:`I couldn't find ${r.no_match_for.join(' or ')} in the demo data.`,def:'',cites:[]};
  let t=`${sc?'For '+esc(sc)+', s':'S'}pend over ${e.period==='all24'?'the last 24 months':e.period==='prior12'?'the prior 12 months':e.month?'that month':'the last 12 months'} is <b>${money(r.spend)}</b> across ${num(r.lines)} PO lines${r.change_pct!=null&&!e.month&&isFinite(r.change_pct)?`, ${pct(r.change_pct)} vs. the year before`:''}.`;
  if(e.unknownSup)t=`I don't see a supplier called "${esc(e.unknownSup)}" in the demo data, so this is the total. `+t;
  if(r.expedite_freight)t+=` Expedite freight on top: ${money(r.expedite_freight)}.`;
  if(r.groups)t+=ul(r.groups.slice(0,6).map(x=>`${esc(x.name)}: <b>${money(x.spend)}</b> (${x.share_pct.toFixed(0)}%)`));
  return {txt:t,def:DEF.spend,cites:[lk('Open in Spend explorer','explorer',()=>{S.exp.path=e.plant?[{lv:'plant',id:e.plant}]:[];S.exp.type=e.buy||'All'})]}},
 spendGrowth(e){const r=T_.spend_summary({...f_(e),group_by:'category',top:12});const pr=T_.spend_summary({...f_(e),period:'prior12',group_by:'category',top:12});const pm=Object.fromEntries(pr.groups.map(g=>[g.key,g.spend]));
  const rows=r.groups.map(g=>({...g,ch:pm[g.key]?(g.spend/pm[g.key]-1)*100:null})).filter(g=>g.ch!=null).sort((a,b)=>b.ch-a.ch);
  return {txt:`Fastest-growing categories vs. last year:`+ul(rows.slice(0,5).map(g=>`${esc(g.name)}: <b>${pct(g.ch)}</b> to ${money(g.spend)}`))+`Part of the growth is new items and summer volume, not price; the Spend explorer splits price, volume and new items.`,def:DEF.spend,cites:[lk('Spend explorer','explorer',()=>S.exp.path=[])]}},
 invBridge(){return {txt:`Spare-parts inventory rose <b>$6.0M</b>, from $41.2M to $47.2M. Most of it is not inflation:`+ul(['Items added to the system: <b>+$3.5M</b> (58%)','Price: +$1.4M','Volume: +$1.6M','Consumption and write-offs: -$0.5M']),def:'Inventory bridge: change in on-hand value split into new items, price (at prior quantity) and volume (at current price).',cites:[lk('Open the bridge','cockpit',()=>S.bridge='added')]}},
 invTarget(e){const rows=Object.entries(INV_BY_PLANT).map(([k,v])=>({k,...v,gap:v.now-v.target})).sort((a,b)=>b.gap-a.gap);if(e.plant){const v=INV_BY_PLANT[e.plant];return {txt:`${plantName(e.plant)} holds <b>$${v.now}M</b> against a target of $${v.target}M, $${(v.now-v.target).toFixed(1)}M over. Last year it was $${v.prev}M.`,def:DEF.inv,cites:[lk('Storeroom view','plant',()=>{S.plant=e.plant;S.plantTab='risk'})]}}
  return {txt:`<b>${plantName(rows[0].k)}</b> is furthest from target, $${rows[0].gap.toFixed(1)}M over.`+ul(rows.map(r=>`${plantName(r.k)}: $${r.now}M vs. target $${r.target}M (${r.gap>0?'+':''}${r.gap.toFixed(1)})`))+`Total $47.2M vs. a $42.6M target by Jun 2027.`,def:DEF.inv,cites:[lk('Executive overview','cockpit')]}},
 premium(e){const ls=filterPO({...f_(e),period:e.period||'last12'}).filter(p=>p.buyType==='Ad hoc'||p.buyType==='Emergency');const memo={};let prem=0;ls.forEach(p=>{const b=memo[p.item]||(memo[p.item]=baselines(p.item));prem+=Math.max(0,p.price-(b?b.ctx:p.price))*p.qty+p.expedite});
  const byCat={};ls.forEach(p=>byCat[p.cat]=(byCat[p.cat]||0)+p.expedite);const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const sc=scopeLabel({...e,buy:null});return {txt:`${sc?'For '+esc(sc)+', we':'We'} paid about <b>${money(prem)}</b> in premiums over 12 months on ${ls.length} ad hoc and emergency buys, including ${money(sum(ls,p=>p.expedite))} of expedite freight.${!e.cat&&top.length?' Most expedite freight went on '+top.map(([k,v])=>esc(catName(k).toLowerCase())+' ('+money(v)+')').join(', ')+'.':''} Buying these ahead at planned prices is the fix.`,def:DEF.prem,cites:[lk('Part details','part',()=>{})]}},
 savings(){const v=sum(SAV.filter(s=>s.status==='Validated'),s=>s.real||0),i=sum(SAV,s=>s.ident);return {txt:`Finance has validated <b>${money(v)}</b> of ${money(i)} identified.`+ul(SAV.map(s=>`${esc(s.desc)}: ${money(s.ident)} · <i>${s.status}</i>${s.note?' (peer-based, not accepted)':''}`)),def:'Savings count once Finance validates them against the agreed method (IR-04).',cites:[lk('Savings validation','savings')]}},
 savingsPeer(){const s=SAV.find(x=>x.note);return {txt:`${esc(s.desc)} (${money(s.ident)}) is based on an external peer benchmark. Incture has never accepted peer-based savings, so it stays a pointer for where to look, not a booked saving. If we run an RFP on filters and the bids come in lower, that becomes a real, validated saving.`,def:'Savings method (IR-04); Incture policy on peer benchmarks (T11).',cites:[lk('Savings validation','savings')]}},
 opps(e){const r=T_.work_and_opportunities({topic:'opportunities',category:e.cat,limit:5});return {txt:`${e.cat?'In '+esc(catName(e.cat).toLowerCase())+', there are':'There are'} ${r.count} open opportunities worth about <b>${money(r.total_value)}</b> a year. The biggest:`+ul(r.top.slice(0,5).map(o=>`${esc(o.type)}: ${money(o.value)} · ${esc(o.text)}`)),def:'Estimated annual value; confidence from how complete the data is.',cites:[lk('Opportunity feed','opportunities',()=>{S.oppType='All'})]}},
 rfpCandidates(){const o=OPPS.filter(x=>x.type==='Sourcing wave candidate');return {txt:`These categories are the strongest RFP candidates: many suppliers and contracts expiring before mid-2027.`+ul(o.slice(0,5).map(x=>`${esc(catName(x.cat))}: about ${money(x.value)} a year · ${esc(x.text.split(': ')[1]||x.text)}`))+`Run them outside the May–August peak.`,def:'Sourcing-wave rule: 3+ suppliers in 12 months; value = 6% of category spend.',cites:[lk('Opportunity feed','opportunities',()=>S.oppType='Sourcing wave candidate')]}},
 onbSummary(){const i=STAGES.find(s=>s.id==='int').n;return {txt:`<b>${num(i)}</b> of ${num(SLP.length)} suppliers in Ariba SLP are integrated with S/4HANA (${(i/SLP.length*100).toFixed(1)}%). The rest:`+ul(STAGES.filter(s=>s.id!=='int').map(s=>`${s.name}: ${num(s.n)}`))+`Questionnaires are the biggest bottleneck.`,def:'Ariba SLP stage matched to the S/4HANA supplier master, refreshed daily.',cites:[lk('Supplier onboarding','onboarding',()=>{S.ob.stage='all';S.ob.age=0})]}},
 onbStuck(){const r=T_.supplier_info({view:'onboarding',min_days:60,limit:5});return {txt:`<b>${num(r.matching)}</b> suppliers have waited more than 60 days. Longest waiting:`+ul(r.longest_waiting.map(x=>`${esc(x.name)}: ${esc(x.stage)}, ${x.days} days, owner ${esc(x.owner)}`)),def:'Days in the current SLP stage.',cites:[lk('Show them','onboarding',()=>{S.ob.stage='all';S.ob.age=60})]}},
 onbStage(e,stage){const st=STAGES.find(s=>s.id===stage);const r=T_.supplier_info({view:'onboarding',stage,limit:4});const old=SLP.filter(x=>x.stage===stage&&x.days>30).length;return {txt:`<b>${num(st.n)}</b> suppliers are at "${st.name}"; ${old} of them for more than 30 days. Longest:`+ul(r.longest_waiting.map(x=>`${esc(x.name)}: ${x.days} days${x.open_questionnaires?', '+x.open_questionnaires+' questionnaires open':''}, owner ${esc(x.owner)}`)),def:'Ariba SLP stage, refreshed daily.',cites:[lk('Filter the list','onboarding',()=>{S.ob.stage=stage;S.ob.age=0})]}},
 onbOwner(){const r=T_.supplier_info({view:'onboarding',min_days:30});const by=r.by_owner.filter(x=>x.owner!=='—').sort((a,b)=>b.count-a.count);return {txt:`Suppliers waiting more than 30 days, by owner:`+ul(by.map(x=>`${esc(x.owner)}: <b>${x.count}</b>`))+`Reassign or send reminders in bulk from the onboarding screen.`,def:'Open SLP suppliers by owner, waiting 30+ days.',cites:[lk('Supplier onboarding','onboarding',()=>{S.ob.stage='all';S.ob.age=30})]}},
 catq(e,human){const h=CATQ.filter(c=>c.tier==='human'),s=CATQ.filter(c=>c.tier==='suggest');if(human)return {txt:`<b>${h.length}</b> lines need a person, because the description doesn't fit any code well:`+ul(h.map(c=>`"${esc(c.desc)}" (${c.conf}% confident) · now in ${esc(c.assigned)}`)),def:'AI confidence below 70% between the description and any commodity code.',cites:[lk('Categorisation queue','dataquality',()=>S.dq='cat')]};
  return {txt:`Of ${CATQ.length} recent lines, <b>${h.length+s.length}</b> are probably in the wrong category: ${s.length} have a confident alternative, ${h.length} need a person. ${CATQ.filter(c=>c.tier==='keep').length} look right as they are.`,def:'AI suggestion confidence: 95%+ keep, 70–95% suggest, under 70% human review.',cites:[lk('Categorisation queue','dataquality',()=>S.dq='cat')]}},
 dups(){const o=DUPS.filter(d=>d.status==='Open');return {txt:`<b>${o.length}</b> Ariba/S/4HANA duplicate pairs are open, which would double-count about ${money(sum(o,d=>d.impact))} if not merged.`+ul([...new Set(o.map(d=>d.field))].map(f=>`${esc(f)}: ${o.filter(d=>d.field===f).length}`)),def:'Same transaction or master record arriving from both systems.',cites:[lk('Duplicates queue','dataquality',()=>S.dq='dup')]}},
 unique(e){const its=ITEMS.filter(i=>i.unique&&(!e.cat||i.cat===e.cat));return {txt:`<b>${its.length}</b> items${e.cat?' in '+esc(catName(e.cat).toLowerCase()):''} in this sample are flagged Incture-unique, and ${UNIQ.filter(u=>u.status==='Proposed').length} more are proposed by AI. Across Incture, you estimate 40,000–50,000 of 100,000 parts are unique.`+ul(its.slice(0,4).map(i=>`${esc(i.desc)} · spec ${i.spec}`)),def:'Unique = cannot be bid on part number alone; needs a spec or drawing.',cites:[lk('Unique items queue','dataquality',()=>S.dq='uniq')]}},
 mpn(){const m=ITEMS.filter(i=>!i.mpnFilled);return {txt:`<b>${m.length}</b> of ${ITEMS.length} sample items (${(m.length/ITEMS.length*100).toFixed(0)}%) are missing a manufacturer part number. AI proposes one from the description for each; a person confirms.`,def:'Item master completeness (G4).',cites:[lk('Item master gaps','dataquality',()=>S.dq='item')]}},
 lastPriceHow(){return {txt:`Open any item in <b>Part details</b>: it shows the last price paid from PO lines (not S/4HANA average cost), when, from whom, and whether it was a rush buy. Next to it you'll see the simple average, weighted average and the comparable-buy baseline, which ignores emergency and ad hoc buys.`,def:DEF.base,cites:[lk('Item search','search',()=>S.search='bearings')]}},
 item(e,q){const r=pickIt(e,q);if(!r.details.length)return {txt:`I couldn't find that part in the demo data. Try a part number like 6205 or a word like "motor".`,def:'',cites:[lk('Item search','search')]};
  const d=r.details[0],p=d.price;let t=`<b>${esc(d.desc)}</b> (${d.pn}). `;
  if(p)t+=`Last paid <b>${money2(p.last_paid)}</b> on ${p.last_date} from ${esc(p.last_supplier)}, ${/^[ae]/i.test(p.last_buy_type)?'an':'a'} ${p.last_buy_type.toLowerCase()} buy${p.last_expedite?` with $${p.last_expedite} expedite`:''}. Comparable-buy baseline: <b>${money2(p.comparable_buy_baseline)}</b>.`;
  t+=ul([d.contract?`Contract ${d.contract.id} with ${esc(d.contract.supplier)} at ${money2(d.contract.price)}, ends ${d.contract.ends}`:'No contract',`Stock: `+PLANTS.map(x=>`${x.id} ${d.stock[x.id].onHand}`).join(', '),d.incture_unique?`Incture-unique: spec ${d.spec} must go with every order`:`Criticality ${d.criticality}, lead time ${d.lead_days} days`]);
  if(r.matches>1)t+=`${r.matches-1} other items also match.`;return {txt:t,def:DEF.base,cites:[lk('Open part details','part',()=>S.part=d.id)]}},
 stock(e,q){const r=pickIt(e,q);if(!r.details.length)return I.item(e,q);const d=r.details[0];const here=e.plant||'LMS';
  const others=PLANTS.filter(p=>d.stock[p.id].onHand>0);return {txt:`<b>${esc(d.desc)}</b> on hand: `+ul(PLANTS.map(p=>`${p.name}: ${d.stock[p.id].onHand} (min ${d.stock[p.id].min}, max ${d.stock[p.id].max})`))+(others.length?`Transfer from a plant above its max before buying.`:`No plant has stock; order on contract.`),def:'On-hand from S/4HANA Inventory.',cites:[lk('Open part details','part',()=>S.part=d.id)]}},
 contractOf(e,q){const r=pickIt(e,q,3);const ds=r.details.filter(d=>d.contract);if(!ds.length)return {txt:`None of the matching items has a contract. They are candidates for the next sourcing wave.`,def:'',cites:[lk('Opportunity feed','opportunities')]};
  return {txt:`Contract suppliers:`+ul(ds.map(d=>`${esc(d.desc)}: <b>${esc(d.contract.supplier)}</b> at ${money2(d.contract.price)} (${d.contract.id}, ends ${d.contract.ends})`)),def:'Active contracts from Ariba Contracts.',cites:[lk('Open part details','part',()=>S.part=ds[0].id)]}},
 contracts(e){const lim=new Date(2027,4,11);const its=ITEMS.filter(i=>i.contract&&i.contract.end<lim&&i.contract.end>=TODAY&&(!e.cat||i.cat===e.cat)).sort((a,b)=>a.contract.end-b.contract.end);
  return {txt:`<b>${its.length}</b> ${e.cat?esc(catName(e.cat).toLowerCase())+' ':''}contracts expire in the next 6 months. Earliest:`+ul(its.slice(0,5).map(i=>`${fdate(i.contract.end)}: ${esc(i.desc)} with ${esc(supName(i.contract.sup))}`))+`Start renewals or RFPs 6–9 months ahead, outside the summer peak.`,def:'Contract end dates from Ariba Contracts.',cites:[lk('Contract calendar','category',()=>S.cat=e.cat||'BRG')]}},
 offContract(e){const ls=filterPO(f_(e));const off=ls.filter(p=>!p.onContract);const offC=off.filter(p=>itemById(p.item).contract);return {txt:`<b>${money(sum(off,p=>p.ext))}</b> (${(sum(off,p=>p.ext)/sum(ls,p=>p.ext)*100).toFixed(0)}%) of ${e.cat?esc(catName(e.cat).toLowerCase())+' ':''}spend was off contract in 12 months. ${money(sum(offC,p=>p.ext))} of that was for items that <i>have</i> a contract, which is leakage we can stop.`,def:'Off contract = bought from a supplier other than the contracted one, or with no contract.',cites:[lk('Contract leakage','opportunities',()=>S.oppType='Contract leakage')]}},
 contractShare(){return {txt:`<b>${(CONTRACT_SHARE*100).toFixed(1)}%</b> of MRO spend in the last 12 months was with the contracted supplier at contract price, against a 75% target. The biggest gap is items that have a contract but were bought elsewhere.`,def:'Spend on contract ÷ total spend, 12 months.',cites:[lk('Contract leakage','opportunities',()=>S.oppType='Contract leakage')]}},
 index(e){const c=CATS.find(x=>x.id===(e.cat||'BRG'));return {txt:`Yes. ${esc(c.name)} prices paid rose about <b>${pct(c.idx*1.6)}</b> in 12 months vs. ${pct(c.idx)} for the market index. That ${(c.idx*0.6).toFixed(1)}-point gap is negotiable, worth about ${money(sum(L12.filter(p=>p.cat===c.id),p=>p.ext)*c.idx*0.006)} a year. Emergency buys are excluded, so rush prices don't inflate the case.`,def:'Index-adjusted price movement (IR-03).',cites:[lk('Negotiation brief','category',()=>{S.cat=c.id;S.modal='brief'})]}},

 fragmentation(){const rows=CATS.map(c=>({c,n:new Set(L12.filter(p=>p.cat===c.id).map(p=>p.sup)).size,s:sum(L12.filter(p=>p.cat===c.id),p=>p.ext)})).filter(r=>r.n).sort((a,b)=>b.n-a.n);return {txt:`Supplier count per category, 12 months:`+ul(rows.slice(0,6).map(r=>`${esc(r.c.name)}: <b>${r.n}</b> suppliers, ${money(r.s)}`))+`Four or more suppliers on one category is usually a consolidation opportunity.`,def:'Distinct suppliers with PO spend, 12 months.',cites:[lk('Category workspace','category')]}},

 excess(e){const pl=e.plant||S.plant;const ex=ITEMS.filter(i=>i.crit==='C'&&i.stock[pl].max>0&&i.stock[pl].onHand>i.stock[pl].max);const all=ITEMS.filter(i=>i.stock[pl].max>0&&i.stock[pl].onHand>i.stock[pl].max);return {txt:`About <b>${money(sum(ex,i=>(i.stock[pl].onHand-i.stock[pl].max)*i.base))}</b> of non-critical stock is above max at ${plantName(pl)} across ${ex.length} items. I left out ${all.length-ex.length} critical spares that sit idle on purpose.`,def:'Above max, non-critical only (IR-07).',cites:[lk('Excess & obsolete','plant',()=>{S.plant=pl;S.plantTab='excess'})]}},

 production(e){const pl=e.plant||S.plant;const pts=MONTHS.map((m,i)=>({x:PROD[pl][i],y:sum(PO.filter(p=>p.plant===pl&&p.mi===i&&['BRG','LUB','PKG','PMP'].includes(p.cat)),p=>p.ext)}));const n=pts.length,mx=sum(pts,p=>p.x)/n,my=sum(pts,p=>p.y)/n;const r=sum(pts,p=>(p.x-mx)*(p.y-my))/Math.sqrt(sum(pts,p=>(p.x-mx)**2)*sum(pts,p=>(p.y-my)**2));const sl=sum(pts,p=>(p.x-mx)*(p.y-my))/sum(pts,p=>(p.x-mx)**2);
