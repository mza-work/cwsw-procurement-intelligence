 motors(){const m=ITEMS.filter(i=>i.cat==='MOT');return {txt:`We buy <b>${m.length}</b> motor and drive items in ${new Set(m.map(i=>i.sub)).size} groups, ${money(sum(L12.filter(p=>p.cat==='MOT'),p=>p.ext))} in 12 months with ${new Set(L12.filter(p=>p.cat==='MOT').map(p=>p.sup)).size} suppliers.`+ul([...new Set(m.map(i=>i.sub))].map(s=>`${esc(s)}: ${m.filter(i=>i.sub===s).length} items`)),def:'Semantic search over normalised item attributes.',cites:[lk('See results','search',()=>S.search='motors')]}},
 decisions(){return {txt:S.log.length?`So far in this session:`+ul(S.log.slice(0,6).map(l=>`${esc(l.action)}: ${esc(l.detail)}`)):`No decisions yet in this session.`,def:'Decisions log (IR-05).',cites:[]}},
 help(){return {txt:`I can answer questions about spend, parts and prices, inventory and critical spares, suppliers and onboarding, invoices and savings, opportunities, RFPs and maintenance in the demo data. Try naming a plant, category, supplier or part number, for example "emergency spend at Dunmore by category" or "last price for the 6205 bearing".`,def:'',cites:[]}}

/* ---------- routing ---------- */
function tok(s){return lc(s).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!['the','and','for','what','which','how','are','our','did','does','with','many','much','have','that','this','from','vs.'].includes(w))}
function route(q){const s=lc(q);const e=entities(q);
  // 1) close match to any bank question
  const qt=tok(q);let best=null,bs=0;Object.values(QB).flat().forEach(b=>{const bt=tok(b[0]);const ov=bt.filter(w=>qt.includes(w)).length/Math.max(bt.length,qt.length);if(ov>bs){bs=ov;best=b}});
  if(best&&bs>=0.6){const extra=best[2]||{};const e2={...e};if(extra.plant&&!e2.plant)e2.plant=extra.plant;
    if(best[1]==='onbStage')return I.onbStage(e2,extra.stage); if(best[1]==='catq')return I.catq(e2,extra.human); if(best[1]==='leak')return I.leak(e2,extra.type);
    if(best[1]==='spend'&&extra.by)e2.by=extra.by; if(best[1]==='topSup'&&/bearing/.test(lc(best[0]))&&!e2.cat)e2.cat='BRG';
    return I[best[1]](e2,q)}
  // 2) intent keywords
  const has=(...w)=>w.some(x=>s.includes(x));
  if(has('motors we buy','all motors'))return I.motors();
  if(has('onboard','slp','integrated','questionnaire','registration','invited')){if(has('questionnaire'))return I.onbStage(e,'quest');if(has('approved'))return I.onbStage(e,'approved');if(has('owner'))return I.onbOwner();if(has('stuck','longest','waiting','overdue'))return I.onbStuck();return I.onbSummary()}
  if(has('categoris','categoriz','mis-categ','miscateg','wrong category','wrong code')){return I.catq(e,has('person','human','manual'))}
  if(has('duplicate')&&has('invoice'))return I.leak(e,'duplicate');
  if(has('duplicate'))return I.dups();
  if(has('unique'))return I.unique(e);
  if(has('part number','mpn','manufacturer part'))return I.mpn();
  if(has('invoice','leakage','overcharg','billed')){if(has('supplier')&&has('most'))return I.invBySup();if(has('match'))return I.fpm();if(has('recover','claimed','credit'))return I.recovered();return I.leak(e,has('contract')?'contract':has('quantity')?'quantity':has('surcharge')?'surcharge':undefined)}
  if(has('peer','benchmark'))return I.savingsPeer();
  if(has('saving','validated'))return has('opportunit')?I.opps(e):I.savings();
  if(has('opportunit','where can we save','save money'))return I.opps(e);
  if(has('rfp','tender','bid','quote','sourcing')){if(has('status','current'))return I.rfp();return I.rfpCandidates()}
  if(has('predict','alert','condition'))return I.pdm();
  if(has('fail'))return I.failures();
  if(has('production','gallon','output','run-hour','run hour'))return I.production(e);
  if(has('requisition'))return has('contract')?I.reqContract():I.reqs();
  if(has('expir','renew'))return I.contracts(e);
  if(has('index','market','inflation','above market'))return I.index(e);
  if(has('off contract','off-contract','not on contract'))return I.offContract(e);
  if(has('on contract','contract compliance'))return e.cat||e.plant?I.offContract(e):I.contractShare();
  if(has('contract supplier','who supplies','contract for'))return I.contractOf(e,q);
  if(has('late','otif','on time','on-time','deliver','scorecard','perform'))return I.otif(e);
  if(has('premium','rush','expedite')){if(has('usually','average','extra'))return I.premAvg();return I.premium(e)}
  if(has('emergenc')&&has('how many','count','number'))return I.emergencyCount(e);
  if(has('in stock','stock at','on hand','have any'))return I.stock(e,q);
  if(has('excess','obsolete','slow','free up'))return I.excess(e);
  if(has('critical','below min','stock-out','stockout','stock up','short'))return e.plant?I.risk(e):(persona().id==='p6'?I.risk(e):I.riskAll());
  if(has('inventory')){if(has('why','rise','went up','go up','increase','6m'))return I.invBridge();return I.invTarget(e)}
  if(has('target'))return I.invTarget(e);
  if(has('fragment','how many suppliers','supplier count'))return I.fragmentation();
  if(has('grew','growth','fastest'))return I.spendGrowth(e);
  if(has('top supplier','biggest supplier','largest supplier','suppliers do we use','which suppliers'))return I.topSup(e);
  if(has('last price','last paid','pay for','paid for','baseline','price of','cost of','what does','how much is'))return e.text||e.cat?I.item(e,q):I.lastPriceHow();
  if(has('decision','what have i','what did i'))return I.decisions();
  if(has('spend','spent','cost','how much','buy','bought','purchase','volume'))return I.spend(e);
  if(e.text||e.sup)return e.sup?I.otif(e):I.item(e,q);
  return I.help()}

answer=function(q){try{return route(q)}catch(err){console.warn(err);return I.help()}};

askDrawer=function(){let h=_ad();if(!S.ask)return h;const qs=ASKS[S.persona]||[];const asked=new Set(S.msgs.filter(m=>m.q).map(m=>m.q));
  const rest=qs.filter(q=>!asked.has(q));
  // replace the inline suggestion rows with a fuller, collapsible list
  h=h.replace(/<div class="row">(<span class="chip" data-act="askq"[^]*?)<\/div>\s*\n?\s*(<p class="note">|<\/div>\s*<footer>)/,(m,chips,tail)=>`<div class="sugg"><div class="meta">Questions you might ask</div>${rest.slice(0,S.moreQ?rest.length:4).map(q=>`<span class="chip" data-act="askq" data-q="${esc(q)}">${esc(q)}</span>`).join('')}${rest.length>4?`<button class="btn sm ghost" data-act="moreq">${S.moreQ?'Fewer':'More questions ('+(rest.length-4)+')'}</button>`:''}</div>${tail}`);
  h=h.replace(/<div class="row" style="margin-bottom:8px;gap:6px">([^]*?)<span class="grow"><\/span>/,`<div class="row" style="margin-bottom:8px;gap:6px">${rest.slice(0,2).map(q=>`<span class="chip" data-act="askq" data-q="${esc(q)}">${esc(q)}</span>`).join('')}${rest.length>2?`<button class="btn sm ghost" data-act="moreq2">More</button>`:''}<span class="grow"></span>`);
  if(S.msgs.length&&S.moreQ2)h=h.replace('<footer>',`<footer><div class="sugg" style="margin-bottom:8px">${rest.map(q=>`<span class="chip" data-act="askq" data-q="${esc(q)}">${esc(q)}</span>`).join('')}</div>`);
  return h};

route=function(q){const s=lc(q),e=entities(q),has=(...w)=>w.some(x=>s.includes(x));
  const qt=tok(q);let best=null,bs=0;Object.values(NEWQ).flat().forEach(b=>{const bt=tok(b[0]);const ov=bt.filter(w=>qt.includes(w)).length/Math.max(bt.length,qt.length);if(ov>bs){bs=ov;best=b}});
  if(best&&bs>=0.6){if(best[1]==='rising'&&/bearing/.test(lc(best[0]))&&!e.cat)e.cat='BRG';if(best[1]==='oneTime'&&/bearing/.test(lc(best[0]))&&!e.cat)e.cat='BRG';return I[best[1]](e,q)}
  if(has('acknowledg','confirmation'))return I.notAck();
  if(has('overdue order','late order','past promised','orders overdue','orders are overdue')||(has('overdue')&&has('order')))return I.overdue(e);
  if(has('open order','open-order','outstanding commitment','on order value','open po'))return I.openOrders(e);
  if(has('credit memo'))return I.creditMemos();
  if(has('paid late','paid early','past due','unpaid','payment term','payment date','pay late'))return I.payments(e);
  if(has('data check','validation','failing check','checks fail'))return I.checks(e,q);
  if(has('conversion','unit of measure','uom'))return I.convMissing();
  if(has('carrying','holding cost','cost to hold'))return I.carrying(e);
  if(has('bin','stored','storeroom','shelf','location of'))return e.sup&&!e.text?I.supMaster(e):I.whereStored(e,q);
  if(has('reserved','available','on order'))return I.stockDetail(e,q);
  if(has('count')&&has('overdue','not counted','cycle'))return I.countDue(e);
  if(has('reorder point','rop'))return I.ropLow(e);
  if(has('lowest','highest','previous price','price range','price change'))return I.priceRange(e,q);
  if(has('bought once','one-time','one time','only once'))return I.oneTime(e);
  if(has('rising','increasing use','growing use','usage up'))return I.rising(e);
  if(has('price difference','price variance','different price','between suppliers'))return I.supVariance(e);
  if(has('contact','phone','email','where is','located','location')&&e.sup)return I.supMaster(e);
  return _route(q)};

/* ---------- onboarding progress: week over week / month over month, with actions taken ---------- */
const OB_ACT=[{w:17,t:'Morning digest went live (Project 1)'},{w:18,t:'Reminder wave: questionnaires open > 30 days (214 suppliers)'},{w:20,t:'Owners rebalanced: 86 suppliers reassigned'},{w:22,t:'60+ day suppliers escalated to category managers'},{w:24,t:'Reminder wave: invited, not registered (172 suppliers)'}];
const OBW=(()=>{const r=mulberry32(5150),R=(a,b)=>Math.floor(a+r()*(b-a+1)),N=26,wk=[];
  for(let w=0;w<N;w++){const b=OB_ACT.filter(a=>a.w<=w).length;
    const d={int:7+R(0,6)+b*5+(b?R(2,8):0),approved:R(-3,4),quest:b>=2?-(Math.round((7+b*5)*0.6)+R(-3,4)):R(-3,2),reg:-R(1,6)-(b>=3?3:0),invited:-R(0,4)-(b>=5?R(8,14):0)};
    let s=d.int+d.approved+d.quest+d.reg+d.invited; if(s<0){d.approved-=s;s=0} d.notinv=-s;
    d.w60=b<1?R(1,5):-(R(3,9)+b);
    wk.push({w,end:new Date(TODAY.getTime()-(N-1-w)*7*864e5),d,acts:OB_ACT.filter(a=>a.w===w).map(a=>a.t)})}
  const keys=['notinv','invited','reg','quest','approved','int','w60'];
  const cur={};STAGES.forEach(s=>cur[s.id]=s.n);cur.w60=SLP.filter(x=>x.stage!=='int'&&x.stage!=='notinv'&&x.days>60).length;
  let snap={...cur};for(let w=N-1;w>=0;w--){wk[w].snap={...snap};keys.forEach(k=>snap[k]-=wk[w].d[k])}
  wk.start={...snap};return wk})();
function obPeriods(mode){const keys=['notinv','invited','reg','quest','approved','int','w60'];
  const live=S.log.filter(l=>/Reminder|reassign|Escalat/i.test(l.action)).map(l=>`${l.action}: ${l.detail} (this session)`);
  let ps;
  if(mode==='mo'){const g={};OBW.forEach(w=>{const k=w.end.getFullYear()*12+w.end.getMonth();(g[k]=g[k]||[]).push(w)});
    ps=Object.values(g).map(ws=>{const e=ws[ws.length-1],d={};keys.forEach(k=>d[k]=sum(ws,w=>w.d[k]));
      const lbl=e.end.toLocaleString('en-US',{month:'short'})+' '+String(e.end.getFullYear()).slice(2)+(e.end.getMonth()===TODAY.getMonth()&&e.end.getFullYear()===TODAY.getFullYear()?' (to date)':'');
      return {lbl,snap:e.snap,d,acts:ws.flatMap(w=>w.acts)}})}
  else ps=OBW.slice(-12).map(w=>({lbl:'Wk to '+w.end.toLocaleString('en-US',{month:'short',day:'numeric'}),snap:w.snap,d:w.d,acts:w.acts.slice()}));
  if(live.length)ps[ps.length-1].acts.push(...live);
  return ps}
function obProgressCard(){const mode=S.ob.prog||'wk',ps=obPeriods(mode),tot=SLP.length;
  const pre=OBW.filter(w=>w.w<OB_ACT[0].w).slice(-8),post=OBW.filter(w=>w.w>=OB_ACT[1].w);
  const avg=a=>a.length?sum(a,w=>w.d.int)/a.length:0;
  const first=ps[0],last=ps[ps.length-1],startSnap={};Object.keys(first.snap).forEach(k=>startSnap[k]=first.snap[k]-first.d[k]);
  const pct=v=>(v/tot*100).toFixed(1)+'%';
  const W=760,H=200,pl=36,pr=10,pt=26,pb=26,max=Math.max(...ps.map(p=>p.d.int))*1.15,bw=(W-pl-pr)/ps.length;
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  const ticks=[0,Math.round(max/2),Math.round(max)];
  const svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Suppliers newly integrated with S/4HANA per ${mode==='mo'?'month':'week'}">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="10">${t}</text>`).join('')}
   ${ps.map((p,i)=>{const x=pl+i*bw,h=y(0)-y(p.d.int);return `<g class="hb" ${TIP(`<b>${p.lbl}</b><br>+${p.d.int} integrated (${num(p.snap.int)} total, ${pct(p.snap.int)})<br>Questionnaires outstanding ${p.d.quest>0?'+':''}${p.d.quest}<br>Waiting > 60 days ${p.d.w60>0?'+':''}${p.d.w60}${p.acts.length?'<div class="tip-k">Actions: '+p.acts.map(esc).join('; ')+'</div>':''}`)}><rect class="hb-bg" x="${x}" y="${pt-20}" width="${bw}" height="${H-pt-pb+20}" fill="transparent"/><rect x="${x+bw*0.18}" y="${y(p.d.int)}" width="${bw*0.64}" height="${Math.max(1,h)}" rx="3" fill="var(--${p.acts.length?'accent':'green'})" opacity="${p.acts.length?1:0.75}"/><text x="${x+bw/2}" y="${y(p.d.int)-5}" text-anchor="middle" font-size="10">+${p.d.int}</text>${p.acts.length?`<path d="M${x+bw/2} ${pt-18} l5 5 l-5 5 l-5 -5z" fill="var(--purple)"/>`:''}<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="9.5">${mode==='mo'?p.lbl.replace(' (to date)','*'):p.lbl.replace('Wk to ','')}</text></g>`}).join('')}
  </svg>`;
  const dl=(v,goodUp)=>{if(!v)return '<span class="meta">0</span>';const g=goodUp?v>0:v<0;return `<span class="${g?'good':'bad'}">${v>0?'+':''}${v}</span>`};
  return `<div class="card" style="margin-bottom:14px"><div class="card-h"><div><h2>Progress ${mode==='mo'?'month over month':'week over week'}${REQ(['T1','IR-02'])}</h2><p>Suppliers newly integrated with S/4HANA each ${mode==='mo'?'month':'week'}. Blue bars with <span style="color:var(--purple)">◆</span> are periods where actions were taken; hover a bar for detail.</p></div>
   <div class="seg"><button class="${mode==='wk'?'on':''}" data-act="obprog" data-id="wk">Week over week</button><button class="${mode==='mo'?'on':''}" data-act="obprog" data-id="mo">Month over month</button></div></div>
   <div class="grid g4" style="margin-bottom:12px">
    ${kpi('Integrated, '+(mode==='mo'?'this month':'this week'),'+'+last.d.int,`${pct(last.snap.int)} complete, was ${pct(last.snap.int-last.d.int)}`,'good')}
    ${kpi('Integrated over period shown','+'+num(last.snap.int-startSnap.int),`${pct(startSnap.int)} → ${pct(last.snap.int)} since ${ps[0].lbl.replace('Wk to ','week to ')}`,'good')}
    ${kpi('Questionnaires outstanding',num(last.snap.quest),`${last.d.quest>0?'+':''}${last.d.quest} ${mode==='mo'?'month':'week'} over ${mode==='mo'?'month':'week'} · ${num(startSnap.quest)} at start`,last.d.quest<=0?'good':'bad')}
    ${kpi('Waiting > 60 days',num(last.snap.w60),`${last.d.w60>0?'+':''}${last.d.w60} ${mode==='mo'?'month':'week'} over ${mode==='mo'?'month':'week'} · ${num(startSnap.w60)} at start`,last.d.w60<=0?'good':'bad')}
   </div>
   ${svg}
   <div class="callout ai" style="margin:10px 0"><span class="ai-mark">Effect of actions</span> Before the first action, about <b>${avg(pre).toFixed(0)}</b> suppliers a week reached S/4HANA. Since the first reminder wave it has been <b>${avg(post).toFixed(0)}</b> a week, ${(avg(post)/Math.max(1,avg(pre))).toFixed(1)}× the earlier pace. At this pace the remaining ${num(tot-last.snap.int)} suppliers would be integrated in about ${Math.ceil((tot-last.snap.int)/Math.max(1,avg(post)))} weeks.</div>
   <div class="tw" style="max-height:340px;overflow:auto"><table><tr><th>${mode==='mo'?'Month':'Week'}</th><th class="n">Integrated (end)</th><th class="n">Change</th><th class="n">Questionnaires outstanding</th><th class="n">Invited, not registered</th><th class="n">Waiting > 60 days</th><th>Actions taken</th></tr>
   ${ps.slice().reverse().map(p=>`<tr><td style="white-space:nowrap">${p.lbl}</td><td class="n">${num(p.snap.int)} <span class="meta">${pct(p.snap.int)}</span></td><td class="n">${dl(p.d.int,true)}</td><td class="n">${num(p.snap.quest)} ${dl(p.d.quest,false)}</td><td class="n">${num(p.snap.invited)} ${dl(p.d.invited,false)}</td><td class="n">${num(p.snap.w60)} ${dl(p.d.w60,false)}</td><td>${p.acts.length?p.acts.map(a=>`<div><span style="color:var(--purple)">◆</span> ${esc(a)}</div>`).join(''):'<span class="meta">—</span>'}</td></tr>`).join('')}</table></div>
   <p class="note" style="margin-top:6px">${mode==='mo'?'* Month to date. ':''}Snapshots are taken from the daily 06:00 SLP status run; change is the net movement between consecutive snapshots. Reminders or reassignments you send on this screen show up in the current period.</p></div>`}
const _obP=V.onboarding;V.onboarding=()=>{const h=_obP();const i=h.indexOf('<div class="card" style="margin-bottom:14px"><div class="card-h"><div><h2>Where suppliers are in the journey');

Object.keys(NEWSCN).forEach(k=>SCN[k]=NEWSCN[k]);

scnSteps=function(pid,phase=S.phase){return (SCN[pid]||[]).filter(s=>s.ph<=phase&&viewsFor(s.p||pid,phase).includes(s.v))};
startScn=function(pid,step=0){const st=scnSteps(pid);if(!st.length)return;step=Math.max(0,Math.min(step,st.length-1));const s=st[step];S.scn={pid,step};S.persona=s.p||pid;S.started=true;S.modal=null;S.ask=false;S.menu=false;S.ddStack=[];S.opp=null;S.inv.sel=null;S.req=null;S.bridge=null;if(s.a)s.a();S.view=s.v;S.hlGo=true;history.replaceState(null,'','#'+S.view);render();if(S.view!=='cockpit'||!s.hl)window.scrollTo({top:0})};
S.coachOpen=true;
const vf=x=>typeof x==='function'?x():x;
scnBar=function(){if(!S.scn)return'';const pid=S.scn.pid;const st=scnSteps(pid);const s=st[S.scn.step];if(!s)return'';const sto=STORY[pid];const p=PERSONAS.find(x=>x.id===(s.p||pid));
  return `<div class="coach"><div class="coach-top"><div class="grow"><span class="scn-k">${pid==='e2e'?'End-to-end story':'Guided demo'} · ${esc(sto.title)}</span><div class="dots">${st.map((x,i)=>`<button class="dot ${i===S.scn.step?'on':i<S.scn.step?'done':''}" data-act="scngo" data-id="${i}" ${TIP(`<b>Step ${i+1}</b><br>${esc(x.t)}${x.p?'<br><span class="meta">as '+esc(PERSONAS.find(q=>q.id===x.p).name)+'</span>':''}`)} aria-label="Step ${i+1}">${i+1}</button>`).join('')}</div></div>
   <button class="btn sm ghost" data-act="coach">${S.coachOpen?'Hide notes':'Show notes'}</button><button class="btn sm ghost" data-act="guide" data-id="${pid==='e2e'?'e2e':'flow'}">Demo guide</button><button class="btn sm" data-act="scnprev" ${S.scn.step?'':'disabled'}>Back</button>${S.scn.step<st.length-1?`<button class="btn sm pri" data-act="scnnext">Next</button>`:`<button class="btn sm pri" data-act="scnexit">Done</button>`}<button class="btn sm ghost" data-act="scnexit">Exit</button></div>
   <h3 class="coach-t"><span class="av sm" style="background:${p.col}">${p.ini}</span>Step ${S.scn.step+1} of ${st.length}: ${esc(s.t)}</h3>

  const want=st.hl.toLowerCase();const cands=(S.modal==='guide'?[main]:roots).flatMap(r=>[...r.querySelectorAll('.card,.kpi,.callout,h1,h2,h3,.tabs button,button,.chip,table,header')]).filter(el=>!el.closest('.coach')&&el.textContent.toLowerCase().includes(want));

function fredIcons(root){(root||document).querySelectorAll('#askIn, input[aria-label="Question for Copilot"]').forEach(i=>{const f=i.closest('form');if(f)f.querySelectorAll('button.btn.pri').forEach(b=>b.classList.add('fred-btn'))});(root||document).querySelectorAll('.fred-av:not(.fi)').forEach(e=>{const b=e.closest('button');if(b)b.classList.add('fred-btn');e.classList.add('fi');e.innerHTML=`<img src="${GENIE_PNG}" alt="">`;e.setAttribute('aria-hidden','true')})}
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1){if(n.classList&&n.classList.contains('fred-av'))fredIcons(n.parentNode);else if(n.querySelector&&(n.querySelector('.fred-av:not(.fi)')||n.querySelector('#askIn')))fredIcons(n)}}).observe(document.body,{childList:true,subtree:true});
fredIcons();
/* ===================== PART SEARCH AND HISTORY: search → pick a part → its Part details open right here; every purchase sits in the Purchase history tab ===================== */
GROUP_OF.part='d2';SUBN.d2='Search and part details';
DASH[1].items=[['search','Search by part number, description, manufacturer, supplier part number'],['hist','Every purchase: quantity, price, supplier, date, PO reference (Purchase history tab of the part)']];
delete BRIEF_MAP.d2;
S.recent=S.recent||[];
function d2Results(q,max,compact){const res=d2match(q);if(!q)return '';
  return `<div class="d2-res ${compact?'pop':''}">${res.slice(0,max).map(r=>`<button class="d2-r ${r.it.id===S.part&&S.view==='part'?'on':''}" data-act="d2open" data-id="${r.it.id}"><span class="d2-t"><b>${esc(r.it.desc)}</b><span class="meta mono">${r.it.pn} · ${esc(r.it.mfr)} ${esc(r.it.mpn)}</span></span><span class="d2-m meta">${r.f.slice(0,1).map(([k,v])=>`${k}: ${esc(v)}`).join('')}</span><span class="d2-n meta">${r.n} purchases</span><span class="d2-go">Open ›</span></button>`).join('')||'<p class="meta" style="padding:8px 12px">No part matches. Try part of a number or a word from the description.</p>'}${res.length>max?`<p class="meta" style="padding:6px 12px">${res.length-max} more matches; type more to narrow.</p>`:''}</div>`}
function d2Box(compact){const q=S.d2q||'';const ex=ITEMS.find(i=>i.id===BRG6205());const spn=Object.values(ex.supParts||{})[0];
  return `<div class="d2-bar"><input id="d2q" type="search" value="${esc(q)}" placeholder="Part number, description, manufacturer, manufacturer or supplier part number" aria-label="Search parts" autocomplete="off">${q?`<span class="meta">${d2match(q).length} match${d2match(q).length===1?'':'es'}</span>`:compact?'':`<span class="meta">Try:</span>${[ex.pn,'6205',ex.mfr,spn&&spn.spn].filter(Boolean).map(x=>`<span class="chip" data-act="d2ex" data-q="${esc(x)}">${esc(x)}</span>`).join('')}`}</div>`}
V.d2=()=>{const d=DASH[1];const q=S.d2q||'';const rec=S.recent.filter(id=>itemById(id)).slice(0,6);
  return dashHead(d)+`<div class="card dsec" id="d2-search" style="margin-bottom:14px">${d2Box(false)}${q?d2Results(q,30,false):`<div class="d2-empty"><p class="meta" style="margin:12px 0 8px">Search, then pick a part: its Part details open on this tab, with prices, suppliers, stock, where it is used and every purchase.</p>${rec.length?`<p class="meta" style="margin:10px 0 6px">Recently opened</p><div class="row" style="gap:6px;flex-wrap:wrap">${rec.map(id=>`<span class="chip" data-act="d2open" data-id="${id}">${esc(itemById(id).descShort)} · ${itemById(id).pn}</span>`).join('')}</div>`:''}</div>`}</div>`};

    const main=document.querySelector('main.main');if(main&&!main.querySelector('.d2-top')){const g=main.querySelector('.grp-tabs');if(g)g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.go==='d2'));

  body.cw-app{padding-left:0}
  body.cw-app nav.tabbar{position:sticky;top:0;width:auto;height:auto;bottom:auto;flex-direction:row;padding:6px 8px;overflow-x:auto;overflow-y:hidden}
  body.cw-app .tabbar-in{flex-direction:row;gap:4px}
  body.cw-app .tabbar a{min-width:78px;padding:8px 6px}
  .cw-side-top{display:none}
  .cw-side-foot{flex-direction:row;border:0;margin:0;padding:0}
  body.cw-app .tabbar .grow{display:none}
  body.cw-app header.top{position:static;flex-wrap:wrap;height:auto;padding:10px 16px}
  body.cw-app header.top .brand{flex-shrink:0}
  body.cw-app .tree{top:0;height:auto}
  body.cw-start .start-h h1{font-size:30px}
}

.kh-n-warn{color:var(--amber)}
.kh-n-bad,.ln-ai.bad{color:var(--coral)}

.s1{background:#16A34A}.s2{background:#93C5FD}.s4{background:#FDBA74}
:root[data-theme="dark"] th{color:#94A3B8}
:root[data-theme="dark"] .av{color:#0B1120}
:root[data-theme="dark"] .brand-t small{color:#94A3B8}
:root[data-theme="dark"] .logo-h{background:#fff;border-radius:6px;padding:3px 6px;height:28px}
@media (max-width:600px){.sk-head{grid-template-columns:repeat(3,minmax(0,1fr))!important}.sk-head span{padding-left:0!important;min-width:0;overflow-wrap:anywhere}}

  category:'layers',buyer:'clip',production:'factory',invoices:'receipt',onboarding:'users',trace:'check',hier:'tree',scenarios:'play'};
const SPARK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.8L20 10l-5 3.6L16.5 20 12 16.4 7.5 20 9 13.6 4 10l6.1-1.2z" fill="currentColor"/></svg>';

/* Copilot icon: EM AI star on an accent tile */
window.fredIcons = function(root){
  (root||document).querySelectorAll('#askIn, input[aria-label="Question for Copilot"]').forEach(i=>{const f=i.closest('form');if(f)f.querySelectorAll('button.btn.pri').forEach(b=>b.classList.add('fred-btn'))});
  (root||document).querySelectorAll('.fred-av:not(.fi), .fred-av.fi:not(.cw-sp)').forEach(e=>{const b=e.closest('button');if(b)b.classList.add('fred-btn');e.classList.add('fi','cw-sp');e.innerHTML=SPARK;e.setAttribute('aria-hidden','true')});
};

/* entry page: EM-style top bar and footer, same content */
const _start = V.start;
V.start = () => {
  let h = _start();
  const top = `<div class="cw-entry-top"><span class="cw-logo-chip">${CW_LOGO_SVG}</span><span class="cw-et-tag">Smart Warehouse · Procurement Intelligence</span><span class="sample">Simulated data</span></div><span class="cw-badge"><i></i>Cherrywork AI on SAP S/4HANA, SAP Ariba and SAP BTP</span>`;
  h = h.replace(/<img class="logo-lock"[^>]*>/, top);
  h = h.replace('<h1>What are you presenting today?</h1>', '<h1>What are you <span class="hl">presenting today?</span></h1>');
  return h + '<p class="cw-entry-foot">Prototype v1.0 · Procurement Intelligence · Cherrywork Design System</p>';
};

function shell(){
  const started = S.started && S.view !== 'start';
  document.body.classList.toggle('cw-app', !!started);
  document.body.classList.toggle('cw-start', S.view === 'start');
  const hd = document.querySelector('header.top');
  if (hd) { const s = hd.querySelector('.brand-t small'); if (s) s.innerHTML = 'Smart Warehouse · MRO &amp; indirect · v1.0'; const l = hd.querySelector('img.logo-h'); if (l) l.alt = 'Cherrywork'; }
  const nav = document.querySelector('nav.tabbar'); if (!nav) return;
  if (!nav.querySelector('.cw-side-top')) nav.insertAdjacentHTML('afterbegin', `<div class="cw-side-top"><button class="cw-side-mark" data-act="tostart" title="Cherrywork · change release or person">${CW_MARK_SVG}</button></div>`);
  const bar = nav.querySelector('.tabbar-in'); if (!bar) return;
  bar.querySelectorAll(':scope > a').forEach(a => {
    if (a.querySelector('.cw-ic')) return;
    const v = a.dataset.go || a.dataset.v || (S.view === 'trace' && /Requirements/.test(a.textContent) ? 'trace' : S.view);
    a.insertAdjacentHTML('afterbegin', `<span class="cw-ic">${IC[VIEW_IC[v]] || IC.grid}</span>`);
  });
  let foot = nav.querySelector('.cw-side-foot');
  if (!foot) { nav.insertAdjacentHTML('beforeend', '<div class="cw-side-foot"></div>'); foot = nav.querySelector('.cw-side-foot'); }
  bar.querySelectorAll(':scope > button').forEach(b => {
    const k = b.dataset.act === 'howto' ? 'help' : b.dataset.act === 'scn' ? 'play' : 'grid';
    b.innerHTML = `<span class="cw-ic">${IC[k]}</span><span>${b.textContent.replace(/^[?▶]\s*/, '').trim()}</span>`;
    foot.appendChild(b);
  });
  if (!foot.children.length) foot.remove();
}
function keepThemeLast(){const t=document.getElementById('cw-theme');if(t&&t.nextElementSibling&&t.parentNode===document.body){/* body-level sheet already follows all head sheets */}}

const _r = render;
render = function(){ _r(); try { shell(); fredIcons(); keepThemeLast(); } catch(e) { console.error(e); } };
render();
})();
